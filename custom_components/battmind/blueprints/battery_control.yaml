blueprint:
  name: BattMind - control the home battery
  description: >-
    Lets **BattMind** control your home battery - whatever inverter you have.


    BattMind decides *what* the battery should do. Here you choose *how* your
    inverter does it: for each BattMind action, add the actions to run
    (e.g. "Number: Set value" on the battery's max discharge power,
    "Switch: Turn on" or a service from your inverter integration).


    | BattMind action | The battery should |

    |:---|:---|

    | Stop battery | stop charging and discharging (temperature safety) |

    | Charge from grid | charge from the grid (cheap power) |

    | Forced discharge | discharge/sell to the grid (expensive power) |

    | Discharge allowed | run normally and may discharge to the house |

    | Solar charging only | charge from solar, but not discharge |

    | Solar charging blocked | not charge from solar (the surplus is sold) |


    Fields left empty do nothing.


    **Commands too fast for the inverter?** The steps of an action run right after
    each other. If your inverter (e.g. over Modbus or a slow cloud) does not take
    commands that close together, add a "Delay" step (e.g. 2 seconds) between them
    in the action. That is safe: if BattMind changes action during the delay, the
    run starts over and sends the whole new action.


    **EV (optional):** Choose your charger's power sensor and what should happen
    while the car is charging - e.g. stop discharging, so the battery is not
    drained into the car. Discharging into the car can still be allowed with an
    entity (e.g. Cable Juice Planner's `switch.cjp_<car>_powerwall_discharge_above_needed`),
    optionally only above a battery level (e.g.
    `number.cjp_<car>_ev_charge_after_powerwall_battery_level`).


    **Ready-made setups:** others' setups for many inverters, ready to paste,
    are shared under [Blueprint setups](https://github.com/dezito/BattMind-HACS/discussions/categories/blueprint-setups).
  domain: automation
  author: dezito
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/dezito/BattMind-HACS/blob/main/custom_components/battmind/blueprints/battery_control.yaml
  input:
    battmind:
      name: BattMind
      icon: mdi:home-battery
      input:
        battmind_action:
          name: BattMind action
          description: >-
            The sensor that tells what the battery should do, e.g.
            `sensor.battmind_powerwall_action`.
          selector:
            entity:
              filter:
                - integration: battmind
                  domain: sensor
                  device_class: enum
        repeat_interval:
          name: Repeat interval
          description: >-
            Keep running the current action again with this interval (0 = off).
            The default 5 minutes puts the inverter back on track if a command
            was lost, the inverter changed its mode by itself or the settings
            were changed elsewhere - and the action is also sent when Home
            Assistant starts. Use a shorter interval if the battery is
            controlled via Modbus and needs a command every few seconds.
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration:
        extra_triggers:
          name: Custom triggers
          description: >-
            Extra triggers that also run the current action again. E.g. a change
            of an entity from your inverter, or a time pattern at fixed times.
          default: []
          selector:
            trigger:
    actions:
      name: Actions
      icon: mdi:battery-sync
      input:
        battery_stopped:
          name: Stop battery
          description: >-
            The configured battery temperature is unsafe or unavailable.
            Stop forced modes and set both charging and discharging power to 0.
            This is an additional Home Assistant safeguard, not a replacement
            for the battery management system.
          default: []
          selector:
            action:
        grid_charging:
          name: Charge from grid
          description: >-
            BattMind has planned charging because power is cheap now.
            E.g. force charging from the grid at full power.
          default: []
          selector:
            action:
        force_discharge:
          name: Forced discharge
          description: >-
            Power is expensive now and it pays to sell from the battery.
            E.g. force discharging to the grid at full power.
          default: []
          selector:
            action:
        discharge_allowed:
          name: Discharge allowed (normal operation)
          description: >-
            The battery may be used for the house. E.g. stop forced
            charge/discharge and set charge and discharge power to max.
          default: []
          selector:
            action:
        force_solar_only_charging:
          name: Solar charging only
          description: >-
            The energy is saved for more expensive hours. E.g. stop forced
            charge/discharge, set discharge power and grid charging to 0.
          default: []
          selector:
            action:
        blocked_solar_charge:
          name: Solar charging blocked
          description: >-
            It pays better to sell the solar power now and charge later.
            E.g. set charge power to 0 and discharge power to max.
          default: []
          selector:
            action:
    ev:
      name: EV (optional)
      icon: mdi:car-electric
      collapsed: true
      input:
        ev_chargers:
          name: EV charger power
          description: >-
            Power sensor for one or more EV chargers. Leave empty if you don't
            have an EV.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: power
        ev_threshold:
          name: Car is charging above
          description: Above this power the car is considered to be charging.
          default: 1000
          selector:
            number:
              min: 100
              max: 5000
              step: 100
              unit_of_measurement: W
              mode: box
        ev_charging:
          name: While the car is charging
          description: >-
            Runs instead of "Discharge allowed" and "Solar charging blocked"
            while the car is charging. E.g. set the battery's discharge power
            to 0, so the battery is not drained into the car. For charge from
            grid, forced discharge and solar charging only, BattMind's action
            is still used.
          default: []
          selector:
            action:
        ev_discharge_allowed:
          name: Allow discharging into the car when
          description: >-
            While this entity is on, the car may be charged from the battery:
            "Discharge allowed" runs instead of "While the car is charging". E.g.
            Cable Juice Planner's `switch.cjp_<car>_powerwall_discharge_above_needed`.
            Leave empty to always use "While the car is charging".
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - switch
                    - input_boolean
                    - binary_sensor
        ev_discharge_min_level:
          name: Only above this battery level
          description: >-
            Optional. Discharging into the car is only allowed while the battery
            level is above this entity's value, e.g. Cable Juice Planner's
            `number.cjp_<car>_ev_charge_after_powerwall_battery_level`. Needs the
            battery level below.
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - number
                    - input_number
                    - sensor
        home_battery_level:
          name: Battery level
          description: The battery level sensor of the home battery (only used with the level above).
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: battery

# a new trigger restarts the run, so the repeat loop always runs the latest action
mode: restart
max_exceeded: silent

triggers:
  - id: battmind
    alias: BattMind action changed
    trigger: state
    entity_id: !input battmind_action
    not_to:
      - unavailable
      - unknown
  - id: ev
    alias: EV charging power changed (stable for 30 sec.)
    trigger: state
    entity_id: !input ev_chargers
    to: ~
    for: "00:00:30"
  - id: ev_discharge
    alias: Discharging into the car allowed
    trigger: template
    value_template: "{{ ev_discharge_entity != '' and is_state(ev_discharge_entity, 'on') and (ev_discharge_min_entity == '' or states(home_battery_entity) | float(0) > states(ev_discharge_min_entity) | float(100)) }}"
  - id: ev_discharge
    alias: Discharging into the car no longer allowed
    trigger: template
    value_template: "{{ not (ev_discharge_entity != '' and is_state(ev_discharge_entity, 'on') and (ev_discharge_min_entity == '' or states(home_battery_entity) | float(0) > states(ev_discharge_min_entity) | float(100))) }}"
  - id: start
    alias: Home Assistant started
    trigger: homeassistant
    event: start
  - id: start
    alias: Automations reloaded
    trigger: event
    event_type: automation_reloaded
  - triggers: !input extra_triggers

trigger_variables:
  ev_discharge_entity: !input ev_discharge_allowed
  ev_discharge_min_entity: !input ev_discharge_min_level
  home_battery_entity: !input home_battery_level

variables:
  battmind_action: !input battmind_action
  repeat_interval: !input repeat_interval
  ev_chargers: !input ev_chargers
  ev_threshold: !input ev_threshold
  ev_actions: !input ev_charging
  action: "{{ states(battmind_action) }}"
  repeat_seconds: >-
    {% set r = repeat_interval %}
    {% if r is mapping %}
      {{ (r.get('days', 0) | float(0)) * 86400 + (r.get('hours', 0) | float(0)) * 3600
         + (r.get('minutes', 0) | float(0)) * 60 + (r.get('seconds', 0) | float(0))
         + (r.get('milliseconds', 0) | float(0)) / 1000 }}
    {% else %}
      {{ r | float(0) }}
    {% endif %}
  car_charging: >-
    {{ ev_actions | count > 0
       and ev_chargers | map('states') | map('float', 0)
           | select('gt', ev_threshold | float) | list | count > 0 }}
  ev_discharge_ok: "{{ ev_discharge_entity != '' and is_state(ev_discharge_entity, 'on') and (ev_discharge_min_entity == '' or states(home_battery_entity) | float(0) > states(ev_discharge_min_entity) | float(100)) }}"

conditions:
  - alias: BattMind has a valid action
    condition: template
    value_template: >-
      {{ action in ['battery_stopped', 'grid_charging', 'force_discharge', 'discharge_allowed',
                    'blocked_solar_charge', 'force_solar_only_charging'] }}
  - alias: Started or reloaded - only when the action is repeated
    condition: template
    value_template: "{{ trigger.id != 'start' or repeat_seconds | float > 0 }}"
  - alias: Car started or stopped charging
    condition: template
    value_template: >-
      {{ trigger.id != 'ev'
         or (trigger.from_state.state | float(0) > ev_threshold | float)
            != (trigger.to_state.state | float(0) > ev_threshold | float) }}
  - alias: Discharging into the car changed - only matters while the car is charging
    condition: template
    value_template: "{{ trigger.id != 'ev_discharge' or car_charging }}"

actions:
  - alias: Run the action, and again every repeat interval
    repeat:
      sequence:
        - choose:
            - alias: Stop battery
              conditions: "{{ action == 'battery_stopped' }}"
              sequence: !input battery_stopped
            - alias: Charge from grid
              conditions: "{{ action == 'grid_charging' }}"
              sequence: !input grid_charging
            - alias: Forced discharge
              conditions: "{{ action == 'force_discharge' }}"
              sequence: !input force_discharge
            - alias: Solar charging only
              conditions: "{{ action == 'force_solar_only_charging' }}"
              sequence: !input force_solar_only_charging
            - alias: Car is charging (and discharging into it is not allowed)
              conditions: "{{ car_charging and not ev_discharge_ok }}"
              sequence: !input ev_charging
            - alias: Solar charging blocked
              conditions: "{{ action == 'blocked_solar_charge' }}"
              sequence: !input blocked_solar_charge
          default: !input discharge_allowed
        - alias: Wait for the repeat interval
          if: "{{ repeat_seconds | float > 0 }}"
          then:
            - delay: "{{ repeat_seconds | float }}"
      until:
        # a changed action normally restarts the run, but if the sensor turns
        # unavailable the run must not keep sending the old action
        - "{{ repeat_seconds | float <= 0 or states(battmind_action) != action }}"
