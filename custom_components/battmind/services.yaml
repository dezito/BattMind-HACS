debug_info:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: battmind

export_debug:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: battmind

recalc_charging_history_today:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: battmind

enforce_planning:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: battmind

what_if:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: battmind
    history_days:
      default: 365
      selector:
        number:
          min: 1
          max: 365
          step: 1
          unit_of_measurement: days
          mode: box
    battery_size:
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          unit_of_measurement: kWh
          mode: box
    minimum_level:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    maximum_level:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    starting_level:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    max_charging_power:
      selector:
        number:
          min: 100
          max: 100000
          step: 100
          unit_of_measurement: W
          mode: box
    max_discharging_power:
      selector:
        number:
          min: 100
          max: 100000
          step: 100
          unit_of_measurement: W
          mode: box
    round_trip_loss:
      selector:
        number:
          min: 0
          max: 90
          step: 1
          unit_of_measurement: "%"
          mode: box
    wear_cost_per_kwh:
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          mode: box
    usage_reserve:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    min_profit_per_kwh:
      name: Minimum profit per kWh
      description: Require at least this much profit per discharged kWh before the optimizer allows the action.
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          unit_of_measurement: kr/kWh
          mode: box
    min_total_profit:
      name: Minimum total profit
      description: Require at least this much total profit for a charging or selling action.
      selector:
        number:
          min: 0
          max: 100
          step: 0.01
          unit_of_measurement: kr
          mode: box
    min_sell_kwh:
      name: Minimum energy to sell
      description: Do not create a battery export action below this amount.
      selector:
        number:
          min: 0.2
          max: 1
          step: 0.1
          unit_of_measurement: kWh
          mode: box
    cheap_price_periods:
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box
    cheapest_price_rise_threshold:
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          unit_of_measurement: kr/kWh
          mode: box
    cheap_price_period_rise_threshold:
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          unit_of_measurement: kr/kWh
          mode: box
    powerwall_max_hours_old:
      selector:
        number:
          min: 1
          max: 72
          step: 1
          unit_of_measurement: h
          mode: box
    exclude_sell_hours:
      example: "17,18,19"
      selector:
        text:
    optimizer_control:
      selector:
        boolean:
    use_midnight_battery_level:
      selector:
        boolean:
    solar_charging:
      selector:
        boolean:
    enhance_battery_efficiency:
      selector:
        boolean:
    cheapest_hour_fill_planner:
      name: Cheapest periods planner
      description: Allow actions associated with charging during the cheapest periods.
      selector:
        boolean:
    cheapest_hour_fill_up:
      selector:
        boolean:
    most_expensive_planner:
      name: Most expensive periods planner
      description: Allow charging actions that reserve battery energy for the most expensive periods.
      selector:
        boolean:
    needed_before_max_level_planner:
      name: "Charging: Required before max level planner"
      description: Allow charging needed before forecast solar production fills the battery.
      selector:
        boolean:
    negative_price_planner:
      name: Charge at negative prices
      description: Allow grid charging when the buy price is negative.
      selector:
        boolean:
    grid_charge_to_sell:
      name: Buy from grid to sell later
      description: Allow grid charging associated with later battery export.
      selector:
        boolean:
    most_profit:
      name: "Discharging: Maximise profit"
      description: Allow battery export when selling is more profitable than using the energy in the house.
      selector:
        boolean:
    sell_excess_kwh_available:
      name: "Discharging: Sell excess kWh"
      description: Allow selling battery energy that is not needed for the house reserve.
      selector:
        boolean:
    force_powerwall_max_hours_old_discharge:
      name: "Forced discharge: Max. kWh age in hours"
      description: Allow discharge actions associated with the configured maximum battery-energy age.
      selector:
        boolean:
    discharge_before_solar:
      name: "Discharging: Before the sun"
      description: Allow battery export when solar production is expected to refill the battery later.
      selector:
        boolean:
    only_discharge_on_profit:
      name: Discharge only when profitable
      description: Constrain discharge actions to those that meet the configured profit threshold.
      selector:
        boolean:
    prioritize_discharge_hours_by_energy_cost:
      name: "Discharging: Prioritise by energy cost"
      description: Allow battery discharge to be reserved for higher-priced house-consumption hours.
      selector:
        boolean:
    optimize_solar_charging:
      name: Optimise solar charging
      description: Allow delaying solar charging to use surplus in more valuable hours.
      selector:
        boolean:
export_data:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: battmind

import_data:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: battmind
    file:
      required: true
      example: battmind_20261024_120000.json
      selector:
        text:
    restore_configuration:
      default: false
      selector:
        boolean:
