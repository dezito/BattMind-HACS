debug_info:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: battmind

export_debug:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: battmind

recalc_charging_history_today:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: battmind

enforce_planning:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: battmind

what_if:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: battmind
    history_days:
      default: 365
      selector:
        number:
          min: 1
          max: 365
          step: 1
          unit_of_measurement: days
          mode: box
    battery_size:
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          unit_of_measurement: kWh
          mode: box
    minimum_level:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    maximum_level:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    starting_level:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    max_charging_power:
      selector:
        number:
          min: 100
          max: 100000
          step: 100
          unit_of_measurement: W
          mode: box
    max_discharging_power:
      selector:
        number:
          min: 100
          max: 100000
          step: 100
          unit_of_measurement: W
          mode: box
    round_trip_loss:
      selector:
        number:
          min: 0
          max: 90
          step: 1
          unit_of_measurement: "%"
          mode: box
    wear_cost_per_kwh:
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          mode: box
    usage_reserve:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

export_data:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: battmind

import_data:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: battmind
    file:
      required: true
      example: battmind_20261024_120000.json
      selector:
        text:
    restore_configuration:
      default: false
      selector:
        boolean:
