            all_series_config:
              type: column
              unit: ' kWh'
              float_precision: 1
              show:
                legend_value: false
                in_header: false
            apex_config:
              chart:
                height: 260px
              dataLabels:
                enabled: false
              xaxis:
                labels:
                  format: MMM yy
            series:
              - entity: sensor.battmind_analysis
                name: '@@grid@@'
                color: '#2a78d6'
