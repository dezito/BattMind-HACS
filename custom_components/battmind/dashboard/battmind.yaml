                  --markdown-table-border-color: transparent
                }
            content: |-
              {% macro n(v, d=2) %}{{ v | round(d) if v is number else '–' }}{% endmacro %}
              {% set a = states.sensor.battmind_analysis.attributes %}
              {% if a.months -%}
              @@economy_intro@@

              | @@month@@ | @@charged@@<br>kWh (☀️) | @@charge_price@@<br>kr/kWh | @@discharged@@<br>kWh | @@value@@<br>kr/kWh | @@spread@@<br>kr/kWh | @@avg_price@@<br>kr/kWh | @@savings@@<br>kr |
              |:---|---:|---:|---:|---:|---:|---:|---:|
              {% for m in a.months | reverse -%}
              | **{{ m.label }}** | {{ m.charged }}{% if m.charged_solar %} ({{ m.charged_solar }}){% endif %} | {{ n(m.charge_unit) }} | {{ m.discharged }} | {{ n(m.value_unit) }} | {{ n(m.spread) }} | {{ n(m.get('avg_price')) }} | {{ n(m.savings) }} |
              {% endfor %}
              **@@total@@:** {{ a.total.charged }} kWh @@charged_lower@@, {{ a.total.discharged }} kWh @@discharged_lower@@ · @@savings@@ **{{ n(a.total.savings) }} kr**
              {%- else -%}
              <ha-alert alert-type="info">@@no_data@@</ha-alert>
              {%- endif %}
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            header:
              show: true
              title: '@@economy_energy_title@@'
              show_states: false
            graph_span: 400d
            span:
              end: month
            stacked: true
            now:
              show: false
            yaxis:
              - min: 0
