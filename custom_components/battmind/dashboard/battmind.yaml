              style: |
                ha-card {
                  --markdown-table-border-color: transparent
                }
            content: |-
              {% set a = states.sensor.battmind_analysis.attributes %}
              {% set e = a.expensive_30 or {} %}
              {% if a.expensive -%}
              @@expensive_intro_1@@ **{{ e.days_empty }}** @@expensive_intro_2@@ {{ e.days }} @@days@@ ({{ e.hours }} @@hours@@, {{ e.kwh }} kWh, {{ e.cost | round(2) }} kr)

              | @@day@@ | @@hours@@ | kWh | kr |
              |:---|---:|---:|---:|
              {% for d in a.expensive | reverse -%}
              | {{ d.date[8:10] }}/{{ d.date[5:7] }} | {{ '✅' if d.hours == 0 else d.hours }} | {{ d.kwh | round(1) }} | {{ d.cost | round(2) }} |
              {% endfor %}
              {%- else -%}
              <ha-alert alert-type="info">@@no_data_yet@@</ha-alert>
              {%- endif %}
            grid_options:
              columns: full
      # the solar surplus forecast against the measured surplus
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: '@@section_solar_forecast@@'
            icon: mdi:solar-power-variant-outline
          - type: markdown
            content: "<details><summary>@@read_more@@</summary>\n\n@@solar_forecast_explain@@\n\n</details>"
            grid_options:
              columns: full
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  --markdown-table-border-color: transparent
                }
            content: |-
              {% macro n(v, d=2) %}{{ v | round(d) if v is number else '–' }}{% endmacro %}
              {% set s = states.sensor.battmind_analysis.attributes.solar_forecast or {} %}
              {% if s.plan -%}
              @@solar_forecast_intro@@

              | @@source@@ | @@days@@ | @@mae@@ kWh | @@bias@@ kWh |
              |:---|---:|---:|---:|
              {% for key, label in [('plan', '@@solar_plan@@'), ('database', '@@solar_database@@'), ('forecast', 'Solcast')] if s[key] -%}
              | {{ label }} | {{ s[key].days }} | {{ n(s[key].mae) }} | {{ n(s[key].bias) }} |
              {% endfor %}
              {%- else -%}
              <ha-alert alert-type="info">@@no_data_yet@@</ha-alert>
              {%- endif %}
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            header:
              show: true
              title: '@@solar_forecast_title@@'
              show_states: false
            graph_span: 31d
            span:
              end: day
            now:
              show: false
            yaxis:
              - min: 0
                decimals: 0
            all_series_config:
              unit: ' kWh'
              float_precision: 1
              show:
                legend_value: false
                in_header: false
            apex_config:
              chart:
                height: 240px
              dataLabels:
                enabled: false
              markers:
                size: 3
            series:
              - entity: sensor.battmind_analysis
                name: '@@solar_actual@@'
                type: column
                color: '#eda100'
                data_generator: |
                  return (entity.attributes.plans || []).filter(d => d.plan_solar !== undefined && d.plan_solar !== null).map(d => [new Date(d.date + 'T12:00:00').getTime(), d.solar]);
              - entity: sensor.battmind_analysis
                name: '@@solar_plan@@'
                type: line
                stroke_width: 2
                color: '#2a78d6'
                data_generator: |
                  return (entity.attributes.plans || []).filter(d => d.plan_solar !== undefined && d.plan_solar !== null).map(d => [new Date(d.date + 'T12:00:00').getTime(), d.plan_solar]);
            grid_options:
              columns: full
      # the price forecast of the price integration against the real prices
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: '@@section_price_forecast@@'
            icon: mdi:chart-bell-curve-cumulative
          - type: markdown
            content: "<details><summary>@@read_more@@</summary>\n\n@@price_forecast_explain@@\n\n@@price_forecast_correction_explain@@\n\n</details>"
            grid_options:
              columns: full
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  --markdown-table-border-color: transparent
                }
            content: |-
              {% macro n(v, d=2) %}{{ v | round(d) if v is number else '–' }}{% endmacro %}
              {% macro p(v) %}{{ (v * 100) | round(0) | int ~ ' %' if v is number else '–' }}{% endmacro %}
              {% set f = states.sensor.battmind_analysis.attributes.price_forecast or {} %}
              {% set week = f.last_7 or [] %}
              {% if f.last_30 -%}
              @@price_forecast_intro@@

              | @@days_ahead@@ | @@days@@ | @@mae@@ 7 @@days@@ | @@mae@@ 30 @@days@@ | @@bias@@ | @@worst_hour@@ | @@cheap_hits@@ | @@dear_hits@@ | @@correction@@ |
              |:---|---:|---:|---:|---:|---:|---:|---:|---:|
              {% for l in f.last_30 -%}
              {% set w = week | selectattr('lead', 'eq', l.lead) | first -%}
              | **{{ l.lead }}** | {{ l.days }} | {{ n(w.mae if w else none) }} | {{ n(l.mae) }} | {{ n(l.bias) }} | {{ n(l.max) }} | {{ p(l.cheap) }} ({{ n(l.cheap_miss) }}) | {{ p(l.dear) }} ({{ n(l.dear_miss) }}) | {{ n(l.correction) }} |
              {% endfor %}
              @@price_forecast_unit@@

              {% if not f.correction_on -%}
              <ha-alert alert-type="info">@@price_forecast_correction_off@@</ha-alert>
              {%- elif f.last_30 | selectattr('correction', 'number') | list | length < f.last_30 | length -%}
              <ha-alert alert-type="info">@@price_forecast_correction_waiting@@</ha-alert>
              {%- endif %}
              {%- else -%}
              <ha-alert alert-type="info">@@no_data_yet@@</ha-alert>
              {%- endif %}
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            header:
              show: true
              title: '@@price_forecast_title@@'
              show_states: false
            graph_span: 6d
            span:
              start: day
              offset: -2d
            now:
              show: true
            yaxis:
              - decimals: 2
            all_series_config:
              type: line
              curve: stepline
              unit: ' kr/kWh'
              float_precision: 2
              stroke_width: 2
              show:
                legend_value: false
                in_header: false
            apex_config:
              chart:
                height: 260px
            series:
              - entity: sensor.battmind_analysis
                name: '@@real_price@@'
                color: '#6250d6'
                stroke_width: 3
                data_generator: |
                  return ((entity.attributes.price_forecast || {}).hours || []).filter(h => h.real !== null && h.real !== undefined).map(h => [new Date(h.t + ':00:00').getTime(), h.real]);
              - entity: sensor.battmind_analysis
                name: '@@price_forecast_1@@'
                color: '#2a78d6'
                data_generator: |
                  return ((entity.attributes.price_forecast || {}).hours || []).filter(h => h.d1 !== null && h.d1 !== undefined).map(h => [new Date(h.t + ':00:00').getTime(), h.d1]);
              - entity: sensor.battmind_analysis
                name: '@@price_forecast_2@@'
                color: '#1baf7a'
                data_generator: |
                  return ((entity.attributes.price_forecast || {}).hours || []).filter(h => h.d2 !== null && h.d2 !== undefined).map(h => [new Date(h.t + ':00:00').getTime(), h.d2]);
              - entity: sensor.battmind_analysis
                name: '@@price_forecast_3@@'
                color: '#eb6834'
                data_generator: |
                  return ((entity.attributes.price_forecast || {}).hours || []).filter(h => h.d3 !== null && h.d3 !== undefined).map(h => [new Date(h.t + ':00:00').getTime(), h.d3]);
              - entity: sensor.battmind_analysis
                name: '@@price_forecast_corrected@@'
                color: '#e34948'
                stroke_width: 3
                data_generator: |
                  return ((entity.attributes.price_forecast || {}).hours || []).filter(h => h.corrected !== null && h.corrected !== undefined).map(h => [new Date(h.t + ':00:00').getTime(), h.corrected]);
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            header:
              show: true
              title: '@@price_forecast_error_title@@'
              show_states: false
            graph_span: 31d
            span:
              end: day
            now:
              show: false
            yaxis:
              - min: 0
                decimals: 2
            all_series_config:
              type: line
              unit: ' kr/kWh'
              float_precision: 3
              stroke_width: 2
              show:
                legend_value: false
                in_header: false
            apex_config:
              chart:
                height: 240px
              markers:
                size: 3
            series:
              - entity: sensor.battmind_analysis
                name: '@@price_forecast_1@@'
                color: '#2a78d6'
                data_generator: |
                  return ((entity.attributes.price_forecast || {}).days || []).filter(d => d.d1 !== undefined).map(d => [new Date(d.date + 'T12:00:00').getTime(), d.d1]);
              - entity: sensor.battmind_analysis
                name: '@@price_forecast_2@@'
                color: '#1baf7a'
                data_generator: |
                  return ((entity.attributes.price_forecast || {}).days || []).filter(d => d.d2 !== undefined).map(d => [new Date(d.date + 'T12:00:00').getTime(), d.d2]);
              - entity: sensor.battmind_analysis
                name: '@@price_forecast_3@@'
                color: '#eb6834'
                data_generator: |
                  return ((entity.attributes.price_forecast || {}).days || []).filter(d => d.d3 !== undefined).map(d => [new Date(d.date + 'T12:00:00').getTime(), d.d3]);
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: '@@section_history@@'
            icon: mdi:chart-line
          - type: markdown
            content: "<details><summary>@@read_more@@</summary>\n\n@@history_explain@@\n\n</details>"
            grid_options:
              columns: full
          - type: history-graph
            title: '@@history_title@@'
            hours_to_show: 48
            entities:
              - entity: sensor.battmind_battery_level_needed
                name:
                  type: entity
            min_y_axis: 0
            max_y_axis: 100
            grid_options:
              columns: full
          - type: history-graph
            hours_to_show: 168
            entities:
              - entity: sensor.battmind_kwh_charged_by_solar
                name:
                  type: entity
            grid_options:
              columns: full
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: '@@consumption_forecast@@'
            icon: mdi:home-lightning-bolt
          - type: markdown
            content: "<details><summary>@@read_more@@</summary>\n\n@@consumption_forecast_explain@@\n\n</details>"
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            header:
              show: true
              title: '@@consumption_forecast@@'
            experimental:
              brush: true
            brush:
              selection_span: '@@forecast_span@@'
            graph_span: '@@forecast_span@@'
            span:
              start: hour
            now:
              show: true
              label: '@@now@@'
            apex_config:
              tooltip:
                fixed:
                  enabled: true
                  position: topLeft
              chart:
                height: 320px
            yaxis:
              - id: type
                decimals: 2
                min: 0
                apex_config:
                  tickAmount: 10
              - id: sum
                opposite: true
                decimals: 2
                min: 0
                apex_config:
                  tickAmount: 10
            all_series_config:
              type: line
              opacity: 0.75
              stroke_width: 2
              curve: straight
              yaxis_id: type
              unit: kWh
              show:
                in_brush: true
            series:
              - name: Avg
                entity: sensor.battmind_powerwall_action
                color: orange
                data_generator: |
                  const d = entity.attributes.hour_cost_prediction_avg || {};
                  return Object.entries(d)
                    .map(([ts, v]) => {
                      const d = new Date(ts);
                      d.setMinutes(59,0,0);
                      return [d.getTime(), Number(v)];
                    })
                    .filter(([t, v]) => Number.isFinite(t) && Number.isFinite(v))
                    .sort((a,b) => a[0]-b[0]);
              - name: EMA
                entity: sensor.battmind_powerwall_action
                color: blue
                data_generator: |
                  const d = entity.attributes.hour_cost_prediction_ema || {};
                  return Object.entries(d)
                    .map(([ts, v]) => {
                      const d = new Date(ts);
                      d.setMinutes(59,0,0);
                      return [d.getTime(), Number(v)];
                    })
                    .filter(([t, v]) => Number.isFinite(t) && Number.isFinite(v))
                    .sort((a,b) => a[0]-b[0]);
              - name: Trend
                entity: sensor.battmind_powerwall_action
                color: green
                data_generator: |
                  const d = entity.attributes.hour_cost_prediction_trend || {};
                  return Object.entries(d)
                    .map(([ts, v]) => {
                      const d = new Date(ts);
                      d.setMinutes(59,0,0);
                      return [d.getTime(), Number(v)];
                    })
                    .filter(([t, v]) => Number.isFinite(t) && Number.isFinite(v))
                    .sort((a,b) => a[0]-b[0]);
              - name: Sum Avg
                entity: sensor.battmind_powerwall_action
                color: darkorange
                yaxis_id: sum
                opacity: 0.25
                stroke_width: 4
                data_generator: |
                  const d = entity.attributes.hour_cost_prediction_sum_avg || {};
                  return Object.entries(d)
                    .map(([ts, v]) => {
                    const d = new Date(ts);
                    d.setMinutes(59,0,0);
                    return [d.getTime(), Number(v)];
                    })
                    .filter(([t, v]) => Number.isFinite(t) && Number.isFinite(v))
                    .sort((a,b) => a[0]-b[0]);
              - name: Sum EMA
                entity: sensor.battmind_powerwall_action
                color: darkblue
                yaxis_id: sum
                opacity: 0.25
                stroke_width: 4
                data_generator: |
                  const d = entity.attributes.hour_cost_prediction_sum_ema || {};
                  return Object.entries(d)
                    .map(([ts, v]) => {
                    const d = new Date(ts);
                    d.setMinutes(59,0,0);
                    return [d.getTime(), Number(v)];
                    })
                    .filter(([t, v]) => Number.isFinite(t) && Number.isFinite(v))
                    .sort((a,b) => a[0]-b[0]);
              - name: Sum Trend
                entity: sensor.battmind_powerwall_action
                color: darkgreen
                yaxis_id: sum
                opacity: 0.25
                stroke_width: 4
                data_generator: |
                  const d = entity.attributes.hour_cost_prediction_sum_trend || {};
                  return Object.entries(d)
                    .map(([ts, v]) => {
                    const d = new Date(ts);
                    d.setMinutes(59,0,0);
                    return [d.getTime(), Number(v)];
                    })
                    .filter(([t, v]) => Number.isFinite(t) && Number.isFinite(v))
                    .sort((a,b) => a[0]-b[0]);
            grid_options:
              columns: full
              rows: auto
        column_span: 4
