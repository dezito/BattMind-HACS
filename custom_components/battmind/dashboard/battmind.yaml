                name: '@@savings_home@@'
                color: '#1baf7a'
                data_generator: |
                  return (entity.attributes.months || []).map(m => [new Date(m.month + '-15T12:00:00').getTime(), m.savings_home]);
              - entity: sensor.battmind_analysis
                name: '@@savings_sale@@'
                color: '#6250d6'
                data_generator: |
                  return (entity.attributes.months || []).map(m => [new Date(m.month + '-15T12:00:00').getTime(), m.savings_sale]);
              - entity: sensor.battmind_analysis
                name: '@@wear@@'
                color: '#e34948'
                data_generator: |
                  return (entity.attributes.months || []).map(m => [new Date(m.month + '-15T12:00:00').getTime(), -m.wear]);
            grid_options:
              columns: full
      # measured round trip loss
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: '@@section_loss@@'
            icon: mdi:battery-arrow-down-outline
          - type: markdown
            content: "<details><summary>@@read_more@@</summary>\n\n@@loss_explain@@\n\n</details>"
            grid_options:
              columns: full
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  --markdown-table-border-color: transparent
                }
            content: |-
              {% macro p(v) %}{{ (v * 100) | round(1) ~ ' %' if v is number else '–' }}{% endmacro %}
              {% set a = states.sensor.battmind_analysis.attributes %}
              {% set l = a.loss or {} %}
              | @@loss_configured@@ | @@loss_used@@ | @@loss_30@@ | @@loss_all@@ |
              |---:|---:|---:|---:|
              | {{ p(l.configured) }} | {{ p(l.used) }} | **{{ p(l.last_30) }}** | {{ p(l.all) }} |

              {% set months = (a.months or []) | selectattr('measured_charged', 'defined') | list -%}
              {% if months -%}
              | @@month@@ | @@charged@@ kWh | @@discharged@@ kWh | @@loss@@ |
              |:---|---:|---:|---:|
              {% for m in months | reverse -%}
              | **{{ m.label }}** | {{ m.measured_charged }} | {{ m.measured_discharged }} | {{ p(m.loss) }} |
              {% endfor %}
              {%- endif %}
