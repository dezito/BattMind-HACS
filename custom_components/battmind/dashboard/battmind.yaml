                        stroke_width: 0
                        curve: stepline
                        data_generator: |
                          const rows = [
                            ...(hass.states['sensor.stromligning_current_price_vat']?.attributes?.prices || []),
                            ...(hass.states['binary_sensor.stromligning_tomorrow_available_vat']?.attributes?.prices || []),
                            ...(hass.states['sensor.stromligning_forecasts_vat']?.attributes?.prices || []),
                            ...(hass.states['sensor.stromligning_15min_spotprice_ex_vat']?.attributes?.prices || []),
                            ...(hass.states['binary_sensor.stromligning_15min_tomorrow_available_ex_vat']?.attributes?.prices || []),
                            ...(hass.states['sensor.stromligning_15min_forecasts_ex_vat']?.attributes?.prices || [])
                          ];
                          const hours = new Set((entity.attributes.force_discharge_timestamps || []).map(ts => {
                            const d = new Date(ts); d.setMinutes(0, 0, 0); return d.getTime();
                          }));
                          const times = [...new Set(rows.map(row => new Date(row.start).getTime()).filter(Number.isFinite))].sort((a, b) => a - b);
                          return times.map(time => {
                            const hour = new Date(time); hour.setMinutes(0, 0, 0);
                            return [time, hours.has(hour.getTime()) ? 1 : 0];
                          });
                        show:
                          in_brush: false
                          legend_value: false
