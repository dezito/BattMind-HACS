          target: {}
        label: ''
    sections:
      # economy per month (engine/analysis: the charging history per month)
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: '@@section_economy@@'
            icon: mdi:cash-multiple
          - type: markdown
            content: "<details><summary>@@read_more@@</summary>\n\n@@economy_explain@@\n\n</details>"
            grid_options:
              columns: full
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  --markdown-table-border-color: transparent
                }
            content: |-
              {% macro n(v, d=2) %}{{ v | round(d) if v is number else '–' }}{% endmacro %}
              {% set a = states.sensor.battmind_analysis.attributes %}
              {% if a.months -%}
              @@economy_intro@@

              | @@month@@ | @@charged@@<br>kWh (☀️) | @@charge_price@@<br>@@valuta_kwh@@ | @@discharged@@<br>kWh | @@value@@<br>@@valuta_kwh@@ | @@spread@@<br>@@valuta_kwh@@ | @@avg_price@@<br>@@valuta_kwh@@ | @@savings@@<br>@@valuta@@ |
              |:---|---:|---:|---:|---:|---:|---:|---:|
              {% for m in a.months | reverse -%}
              | **{{ m.label }}** | {{ m.charged }}{% if m.charged_solar %} ({{ m.charged_solar }}){% endif %} | {{ n(m.charge_unit) }} | {{ m.discharged }} | {{ n(m.value_unit) }} | {{ n(m.spread) }} | {{ n(m.get('avg_price')) }} | {{ n(m.savings) }} |
              {% endfor %}
              **@@total@@:** {{ a.total.charged }} kWh @@charged_lower@@, {{ a.total.discharged }} kWh @@discharged_lower@@ · @@savings@@ **{{ n(a.total.savings) }} @@valuta@@**
              {%- else -%}
              <ha-alert alert-type="info">@@no_data@@</ha-alert>
              {%- endif %}
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            header:
              show: true
              title: '@@economy_energy_title@@'
              show_states: false
            graph_span: 400d
            span:
              end: month
            stacked: true
            now:
              show: false
            yaxis:
              - min: 0
                decimals: 0
            all_series_config:
              type: column
              unit: ' kWh'
              float_precision: 1
              show:
                legend_value: false
                in_header: false
            apex_config:
              tooltip:
                shared: true
                intersect: false
              chart:
                height: 260px
              dataLabels:
                enabled: false
              xaxis:
                labels:
                  format: MMM yy
            series:
              - entity: sensor.battmind_analysis
                name: '@@grid@@'
                color: '#2a78d6'
                data_generator: |
                  return (entity.attributes.months || []).map(m => [new Date(m.month + '-15T12:00:00').getTime(), m.charged_grid]);
              - entity: sensor.battmind_analysis
                name: '@@solar@@'
                color: '#eda100'
                data_generator: |
                  return (entity.attributes.months || []).map(m => [new Date(m.month + '-15T12:00:00').getTime(), m.charged_solar]);
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            header:
              show: true
              title: '@@economy_prices_title@@'
              show_states: false
            graph_span: 400d
            span:
              end: month
            now:
              show: false
            yaxis:
              - decimals: 2
            all_series_config:
              type: line
              unit: ' @@valuta_kwh@@'
              float_precision: 2
              stroke_width: 2
              show:
                legend_value: false
                in_header: false
            apex_config:
              tooltip:
