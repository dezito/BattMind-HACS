              - entity: sensor.battmind_analysis
                name: '@@loss_configured@@'
                color: '#8a8a8a'
                data_generator: |
                  const c = (entity.attributes.loss || {}).configured;
                  return (entity.attributes.months || []).map(m => [new Date(m.month + '-15T12:00:00').getTime(), c * 100]);
