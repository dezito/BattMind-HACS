                color: '#1baf7a'
                data_generator: |
                  return (entity.attributes.months || []).filter(m => m.charge_unit !== null).map(m => [new Date(m.month + '-15T12:00:00').getTime(), m.charge_unit]);
              - entity: sensor.battmind_analysis
                name: '@@value@@'
                color: '#e34948'
                data_generator: |
                  return (entity.attributes.months || []).filter(m => m.value_unit !== null).map(m => [new Date(m.month + '-15T12:00:00').getTime(), m.value_unit]);
              - entity: sensor.battmind_analysis
                name: '@@avg_price@@'
                color: '#6250d6'
                data_generator: |
                  return (entity.attributes.months || []).filter(m => m.avg_price !== undefined && m.avg_price !== null).map(m => [new Date(m.month + '-15T12:00:00').getTime(), m.avg_price]);
            grid_options:
              columns: full
      # charged and discharged per rule, the last 12 months
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: '@@section_rules@@'
