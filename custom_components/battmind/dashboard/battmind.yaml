              @@cycles_intro_1@@ **{{ a.total.cycles }}** @@cycles_intro_2@@ ({{ a.battery_size }} kWh) · @@wear@@ **{{ n(a.total.wear) }} @@valuta@@**

              | @@month@@ | @@cycles@@ | @@savings@@ @@valuta@@ | @@wear@@ @@valuta@@ | @@valuta@@/@@cycle@@ |
              |:---|---:|---:|---:|---:|
              {% for m in a.months | reverse -%}
              | **{{ m.label }}** | {{ m.cycles }} | {{ n(m.savings) }} | {{ n(m.wear) }} | {{ n(m.savings_per_cycle) }} |
              {% endfor %}
              {%- else -%}
              <ha-alert alert-type="info">@@no_data@@</ha-alert>
