views:
  - type: sections
    path: overview
    sections:
      - type: grid
        cards:
          - type: custom:apexcharts-card
            graph_span: '@@forecast_span@@'
            experimental:
              brush: true
              hidden_by_default: true
            brush:
              selection_span: '@@forecast_span@@'
            header:
              show: true
              title: '@@soc_chart_title@@'
              show_states: false
            span:
              start: hour
            yaxis:
              - id: soc
                decimals: 1
                min: 0
                max: 100
              - id: state
                opposite: true
                min: 0
                max: 1
                show: false
            apex_config:
              tooltip:
                shared: true
                intersect: false
                custom: |
                  EVAL:function({ series, dataPointIndex, w }) {
                    const time = w.globals.seriesX?.[0]?.[dataPointIndex];
                    const title = Number.isFinite(time)
                      ? new Date(time).toLocaleString(undefined, {
                          weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                        })
                      : '';
                    const hidden = new Set(w.globals.collapsedSeriesIndices || []);
                    const rows = series.map((values, index) => {
                      if (hidden.has(index)) return '';
                      const value = values[dataPointIndex];
                      const valid = value !== null && value !== undefined && Number.isFinite(Number(value));
                      const shown = !valid ? '-' : index === 0 ? `${Number(value).toFixed(0)} %` : Number(value).toFixed(0);
                      return `<div style="display:flex;align-items:center;gap:8px;padding:3px 10px;">
                        <span style="width:10px;height:10px;border-radius:50%;background:${w.globals.colors[index]};"></span>
                        <span>${w.globals.seriesNames[index]}:</span><strong style="margin-left:auto;">${shown}</strong>
                      </div>`;
                    }).join('');
                    return `<div class="apexcharts-tooltip-title" style="padding:6px 10px;">${title}</div>${rows}`;
                  }
                followCursor: true
                fixed:
                  enabled: false
                x:
                  show: true
                  format: ddd dd/MM HH:mm
              stroke:
                curve: smooth
              dataLabels:
                enabled: false
            all_series_config:
              group_by:
                duration: 15min
                func: avg
                fill: last
            series:
              - entity: sensor.battmind_powerwall_action
                type: area
                name: '@@battery_forecast@@'
                yaxis_id: soc
                color: '#4CAF50'
                opacity: 0.25
                data_generator: |
                  const flow = entity.attributes.battery_level_flow || [];
                  return flow.map(p => {
                    const hour = new Date(p.hour);
                    hour.setMinutes(0, 0, 0);
                    return [hour.getTime(), Number(p.battery_level)];
                  });
                curve: straight
                stroke_width: 2
                float_precision: 0
                show:
                  in_brush: true
                  legend_value: false
                  in_header: true
              - entity: sensor.battmind_powerwall_action
                name: '@@charge@@'
                type: area
                yaxis_id: state
                color: '#2196F3'
                opacity: 0.6
                data_generator: |
                  const flow = entity.attributes.battery_level_flow || [];
                  const chargeHours = new Set(
                    (entity.attributes.charge_timestamps || []).map(ts => {
                      const d = new Date(ts);
                      d.setMinutes(0, 0, 0);
                      return d.getTime();
                    })
                  );
                  return flow.map(p => {
                    const hour = new Date(p.hour);
                    hour.setMinutes(0, 0, 0);
                    const time = hour.getTime();
                    return [time, chargeHours.has(time) ? 1 : 0];
                  });
                curve: stepline
                stroke_width: 1
                float_precision: 0
                show:
                  in_brush: false
                  legend_value: false
              - entity: sensor.battmind_powerwall_action
                name: '@@force_discharge@@'
                type: area
                yaxis_id: state
                color: '#FF9800'
                opacity: 0.33
                data_generator: |
                  const flow = entity.attributes.battery_level_flow || [];
                  const forceDischargeHours = new Set(
                    (entity.attributes.force_discharge_timestamps || []).map(ts => {
                      const d = new Date(ts);
                      d.setMinutes(0, 0, 0);
                      return d.getTime();
                    })
                  );
                  return flow.map(p => {
                    const hour = new Date(p.hour);
                    hour.setMinutes(0, 0, 0);
                    const time = hour.getTime();
                    return [time, forceDischargeHours.has(time) ? 1 : 0];
                  });
                curve: stepline
                stroke_width: 0
                float_precision: 0
                show:
                  hidden_by_default: false
                  in_brush: false
                  legend_value: false
              - entity: sensor.battmind_powerwall_action
                name: '@@discharge@@'
                type: area
                yaxis_id: state
                color: '#FDD835'
                opacity: 0.33
                data_generator: |
                  const flow = entity.attributes.battery_level_flow || [];
                  const dischargeHours = new Set(
                    (entity.attributes.discharge_timestamps || []).map(ts => {
                      const d = new Date(ts);
                      d.setMinutes(0, 0, 0);
                      return d.getTime();
                    })
                  );
                  const chargeHours = new Set(
                    (entity.attributes.charge_timestamps || []).map(ts => {
                      const d = new Date(ts);
                      d.setMinutes(0, 0, 0);
                      return d.getTime();
                    })
                  );
                  return flow.map(p => {
                    const hour = new Date(p.hour);
                    hour.setMinutes(0, 0, 0);
                    const time = hour.getTime();
                    return [time, !chargeHours.has(time) && dischargeHours.has(time) ? 1 : 0];
                  });
                curve: stepline
                stroke_width: 0
                float_precision: 0
                show:
                  hidden_by_default: true
                  in_brush: false
                  legend_value: false
              - entity: sensor.battmind_powerwall_action
                name: '@@solar_only@@'
                type: area
                yaxis_id: state
                color: '#F44336'
                opacity: 0.25
                data_generator: |
                  const flow = entity.attributes.battery_level_flow || [];
                  const solarOnlyHours = new Set(
                    (entity.attributes.force_solar_only_charging_timestamps || []).map(ts => {
                      const d = new Date(ts);
                      d.setMinutes(0, 0, 0);
                      return d.getTime();
                    })
                  );
                  return flow.map(p => {
                    const hour = new Date(p.hour);
                    hour.setMinutes(0, 0, 0);
                    const time = hour.getTime();
                    return [time, solarOnlyHours.has(time) ? 1 : 0];
                  });
                curve: stepline
                stroke_width: 0
                float_precision: 0
                show:
                  hidden_by_default: false
                  in_brush: false
                  legend_value: false
            grid_options:
              columns: 60
              rows: auto
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.energi_data_service
                    state: unavailable
                card:
                  type: horizontal-stack
                  cards:
                    - type: markdown
                      content: '# Energi Data Service @@is_down@@ <font color=red>!!!</font>'
                    - show_name: true
                      show_icon: true
                      type: button
                      entity: sensor.energi_data_service
                      tap_action:
                        action: call-service
                        service: homeassistant.reload_config_entry
                        target:
                          entity_id: sensor.energi_data_service
                      hold_action:
                        action: none
                      icon: mdi:reload
                      name: '@@restart@@ Energi Data Service'
                      show_state: true
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.energi_data_service
                    state_not: unavailable
                card:
                  type: custom:config-template-card
                  variables:
                    today_prices: >
                      states['sensor.energi_data_service'].attributes.today ||
                      []
                    tomorrow_prices: >
                      states['sensor.energi_data_service'].attributes.tomorrow
                      || []
                    forecast_prices: >
                      if
                      (states['sensor.energi_data_service'].attributes.forecast)
                      {
                        states['sensor.energi_data_service'].attributes.forecast.map(item =>
                        item.price)
                      } else { []}
                    total_hours: >
                      const allPrices = [...vars.today_prices,
                      ...vars.tomorrow_prices, ...vars.forecast_prices];
                      allPrices.length
                    lowest_price: >
                      let min = 999; const allPrices = [...vars.today_prices,
                      ...vars.tomorrow_prices, ...vars.forecast_prices];
                      allPrices.forEach(price => {
                        if (price < min) min = price;
                      }); min * 1.05
                    highest_price: >
                      let max = -999; const allPrices = [...vars.today_prices,
                      ...vars.tomorrow_prices, ...vars.forecast_prices];
                      allPrices.forEach(price => {
                        if (price > max) max = price;
                      }); max * 0.95
                    mean_price: >
                      let sum = 0.0; const allPrices = [...vars.today_prices,
                      ...vars.tomorrow_prices, ...vars.forecast_prices];
                      allPrices.forEach(price => {
                        sum += price;
                      }); const mean = sum / vars.total_hours; mean
                    step_under_mean: |
                      (vars.mean_price - vars.lowest_price) / 5
                    step_over_mean: |
                      (vars.highest_price - vars.mean_price) / 5
                    price1: vars.lowest_price
                    price2: vars.mean_price - vars.step_under_mean * 4
                    price3: vars.mean_price - vars.step_under_mean * 3
                    price4: vars.mean_price - vars.step_under_mean * 2
                    price5: vars.mean_price - vars.step_under_mean * 1
                    price6: vars.mean_price
                    price7: vars.mean_price + vars.step_over_mean * 1
                    price8: vars.mean_price + vars.step_over_mean * 2
                    price9: vars.mean_price + vars.step_over_mean * 3
                    price10: vars.mean_price + vars.step_over_mean * 4
                    price11: vars.highest_price
                    total_span: 24 * 7 - 1
                  entities: []
                  card:
                    type: custom:apexcharts-card
                    apex_config:
                      chart:
                        height: 300px
                      xaxis:
                        tooltip:
                          enabled: false
                      tooltip:
                        shared: true
                        intersect: false
                        followCursor: true
                        fixed:
                          enabled: false
                        x:
                          show: true
                        enabledOnSeries:
                          - 0
                          - 1
                          - 2
                          - 4
                          - 5
                        custom: |
                          EVAL:function({ series, dataPointIndex, w }) {
                            const indices = [0, 1, 2, 4, 5];
                            const xValues = w.globals.seriesX[0] || [];
                            const time = xValues[dataPointIndex];
                            const title = Number.isFinite(time)
                              ? new Date(time).toLocaleString(undefined, {
                                  weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                                })
                              : '';
                            const rows = indices.map(index => {
                              const values = series[index] || [];
                              const value = values[dataPointIndex];
                              const valid = value !== null && value !== undefined && Number.isFinite(Number(value));
                              const suffix = index < 2 ? ' @@valuta@@' : index === 2 ? ' kWh' : '';
                              const decimals = index < 3 ? 2 : 0;
                              const shown = valid ? Number(value).toFixed(decimals) + suffix : '-';
                              const color = w.globals.colors[index] || '#888';
                              const name = w.globals.seriesNames[index] || '';
                              return '<div style="display:flex;align-items:center;gap:8px;padding:3px 10px;">' +
                                '<span style="width:10px;height:10px;border-radius:50%;background:' + color + ';"></span>' +
                                '<span>' + name + ':</span><strong style="margin-left:auto;">' + shown + '</strong></div>';
                            }).join('');
                            return '<div class="apexcharts-tooltip-title" style="padding:6px 10px;">' + title + '</div>' + rows;
                          }
                      stroke:
                        curve: stepline
                      markers:
                        size: 0
                    all_series_config:
                      unit: kWh
                      extend_to: false
                      fill_raw: zero
                      show:
                        legend_value: false
                        offset_in_name: false
                    experimental:
                      color_threshold: true
                      brush: true
                    brush:
                      selection_span: ${total_span + "h"}
                    header:
                      title: >-
                        ${"@@price_chart_title@@ 🔵" +
                        vars.lowest_price.toFixed(2) + " 🟢" +
                        vars.mean_price.toFixed(2) + " 🟣" +
                        vars.highest_price.toFixed(2)}
                      show: true
                      standard_format: false
                      show_states: false
                      colorize_states: true
                    now:
                      show: true
                      label: '@@now@@'
                    graph_span: ${total_span +"h"}
                    span:
                      start: day
                    yaxis:
                      - id: price
                      - id: solar
                        opposite: true
                        decimals: 1
                        max: ~6.0
                        min: 0
                      - id: state
                        min: 0
                        max: 1
                        show: false
                    show:
                      loading: true
                      last_updated: true
                    series:
                      - entity: sensor.energi_data_service
                        yaxis_id: price
                        type: column
                        name: '@@incl_taxes@@'
                        unit: '@@valuta@@'
                        color: green
                        data_generator: |
                          const buy = entity.attributes || {};
                          const sell = hass.states['sensor.energi_data_service_salg']?.attributes || {};
                          const buyRows = [...(buy.raw_today || []), ...(buy.forecast || []), ...(buy.tomorrow_valid ? buy.raw_tomorrow || [] : [])];
                          const sellRows = [...(sell.raw_today || []), ...(sell.forecast || []), ...(sell.tomorrow_valid ? sell.raw_tomorrow || [] : [])];
                          const exactValues = new Map(buyRows.map(row => [new Date(row.hour).getTime(), Number(row.price)]));
                          const hourKey = value => { const d = new Date(value); d.setMinutes(0, 0, 0); return d.getTime(); };
                          const hourlyValues = new Map(buyRows.map(row => [hourKey(row.hour), Number(row.price)]));
                          const times = [...new Set([...buyRows, ...sellRows].map(row => new Date(row.hour).getTime()).filter(Number.isFinite))].sort((a, b) => a - b);
                          return times.map(time => {
                            const value = exactValues.has(time) ? exactValues.get(time) : hourlyValues.get(hourKey(time));
                            return [time, Number.isFinite(value) ? value : null];
                          });
                        float_precision: 2
                        group_by:
                          func: avg
                          duration: 15min
                        color_threshold:
                          - value: ${vars.price1}
                            color: '#0064FF'
                          - value: ${vars.price2}
                            color: '#0096FF'
                          - value: ${vars.price3}
                            color: '#00B496'
                          - value: ${vars.price4}
                            color: '#00FA50'
                          - value: ${vars.price5}
                            color: '#00FF32'
                          - value: ${vars.price6}
                            color: '#00FF00'
                          - value: ${vars.price7}
                            color: '#FFFF00'
                          - value: ${vars.price8}
                            color: '#FFA500'
                          - value: ${vars.price9}
                            color: '#FF5000'
                          - value: ${vars.price10}
                            color: '#C81919'
                          - value: ${vars.price11}
                            color: '#C800C8'
                        opacity: 0.75
                        show:
                          in_brush: true
                      - entity: sensor.energi_data_service
                        yaxis_id: price
                        type: area
                        name: '@@sell_price@@'
                        unit: '@@valuta@@'
                        color: white
                        stroke_width: 0
                        data_generator: |
                          const buy = hass.states['sensor.energi_data_service']?.attributes || {};
                          const sell = hass.states['sensor.energi_data_service_salg']?.attributes || {};
                          const buyRows = [...(buy.raw_today || []), ...(buy.forecast || []), ...(buy.tomorrow_valid ? buy.raw_tomorrow || [] : [])];
                          const sellRows = [...(sell.raw_today || []), ...(sell.forecast || []), ...(sell.tomorrow_valid ? sell.raw_tomorrow || [] : [])];
                          const values = new Map(sellRows.map(row => [new Date(row.hour).getTime(), Number(row.price)]));
                          const times = [...new Set([...buyRows, ...sellRows].map(row => new Date(row.hour).getTime()).filter(Number.isFinite))].sort((a, b) => a - b);
                          return times.map(time => [time, values.has(time) && Number.isFinite(values.get(time)) ? values.get(time) : null]);
                        float_precision: 2
                        group_by:
                          func: avg
                          duration: 15min
                        opacity: 0.75
                        show:
                          in_brush: true
                      - entity: sensor.energi_data_service
                        yaxis_id: solar
                        type: area
                        name: '@@solar_forecast@@'
                        data_generator: |
                          const hourKey = value => { const d = new Date(value); d.setMinutes(0, 0, 0); return d.getTime(); };
                          const buy = hass.states['sensor.energi_data_service']?.attributes || {};
                          const sell = hass.states['sensor.energi_data_service_salg']?.attributes || {};
                          const buyRows = [...(buy.raw_today || []), ...(buy.forecast || []), ...(buy.tomorrow_valid ? buy.raw_tomorrow || [] : [])];
                          const sellRows = [...(sell.raw_today || []), ...(sell.forecast || []), ...(sell.tomorrow_valid ? sell.raw_tomorrow || [] : [])];
                          const times = [...new Set([...buyRows, ...sellRows].map(row => new Date(row.hour).getTime()).filter(Number.isFinite))].sort((a, b) => a - b);
                          const solarByHour = new Map();
                          const overlay = (series) => (series || []).forEach(row => {
                            const value = Number(row.pv_estimate);
                            if (Number.isFinite(value)) solarByHour.set(hourKey(row.period_start), value);
                          });
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_today']?.attributes?.detailedHourly || []);
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_tomorrow']?.attributes?.detailedHourly || []);
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_3']?.attributes?.detailedHourly || []);
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_4']?.attributes?.detailedHourly || []);
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_5']?.attributes?.detailedHourly || []);
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_6']?.attributes?.detailedHourly || []);
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_7']?.attributes?.detailedHourly || []);
                          return times.map(time => [time, solarByHour.get(hourKey(time)) || 0]);
                        color: orange
                        stroke_width: 0
                        opacity: 0.5
                        group_by:
                          func: avg
                          duration: 15min
                        show:
                          in_brush: true
                      - entity: sensor.energi_data_service
                        yaxis_id: price
                        type: area
                        name: '@@forecast@@'
                        unit: ''
                        stroke_width: 0
                        opacity: 0.25
                        color: purple
                        data_generator: |
                          try {
                            var eds = (entity && entity.attributes) ? entity.attributes : {};
                            //if (eds.tomorrow_valid) return [];

                            // Start: the first forecast hour (most accurate)
                            var start = null;
                            if (eds.forecast && eds.forecast.length && eds.forecast[0] && eds.forecast[0].hour) {
                              start = new Date(eds.forecast[0].hour).getTime();
                            }
                            
                            // Fallback: tomorrow 00:00 local time
                            if (!start || isNaN(start)) {
                              var now = new Date();
                              start = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0).getTime();
                            }
                            
                            
                            // Use the same rows as the ones plotted
                            var rows = [];
                            if (eds.raw_today) rows = rows.concat(eds.raw_today);
                            if (eds.forecast) rows = rows.concat(eds.forecast);
                            if (eds.raw_tomorrow) rows = rows.concat(eds.raw_tomorrow);

                            // Max price to fill "the full height"
                            var maxP = 0;
                            for (var i = 0; i < rows.length; i++) {
                              var p = Number(rows[i] && rows[i].price);
                              if (!isNaN(p) && p > maxP) maxP = p;
                            }
                            if (maxP <= 0) maxP = 10;

                            // Unique times, sorted
                            var map = {};
                            for (var j = 0; j < rows.length; j++) {
                              var h = rows[j] && rows[j].hour;
                              if (!h) continue;
                              var t = new Date(h).getTime();
                              if (isNaN(t)) continue;
                              map[t] = 1;
                            }
                            var times = Object.keys(map).map(function(x){ return Number(x); }).sort(function(a,b){ return a-b; });

                            // Fail-safe: without times, make 2 points so the card doesn't hang
                            if (!times.length) {
                              return [
                                [new Date(start), maxP],
                                [new Date(start + 3600000), maxP]
                              ];
                            }

                            // 0 before the start, max after it => fills the rest
                            var out = [];
                            for (var k = 0; k < times.length; k++) {
                              var tt = times[k];
                              out.push([new Date(tt), (tt >= start) ? maxP : 0]);
                            }
                            return out;

                          } catch (e) {
                            console.log("forecast_zone error", e);
                            return [];
                          }
                        group_by:
                          func: avg
                          duration: 15min
                        show:
                          in_brush: false
                          legend_value: false
                      - entity: sensor.battmind_powerwall_action
                        yaxis_id: state
                        type: area
                        name: '@@charge@@'
                        unit: ''
                        color: '#2ecc71'
                        opacity: 0.22
                        stroke_width: 0
                        curve: stepline
                        data_generator: |
                          const prices = hass.states['sensor.energi_data_service']?.attributes || {};
                          const sell = hass.states['sensor.energi_data_service_salg']?.attributes || {};
                          const rows = [...(prices.raw_today || []), ...(prices.forecast || []), ...(prices.tomorrow_valid ? prices.raw_tomorrow || [] : []), ...(sell.raw_today || []), ...(sell.forecast || []), ...(sell.tomorrow_valid ? sell.raw_tomorrow || [] : [])];
                          const hours = new Set((entity.attributes.charge_timestamps || []).map(ts => {
                            const d = new Date(ts); d.setMinutes(0, 0, 0); return d.getTime();
                          }));
                          const times = [...new Set(rows.map(row => new Date(row.hour).getTime()).filter(Number.isFinite))].sort((a, b) => a - b);
                          return times.map(time => {
                            const hour = new Date(time); hour.setMinutes(0, 0, 0);
                            return [time, hours.has(hour.getTime()) ? 1 : 0];
                          });
                        show:
                          in_brush: false
                          legend_value: false
                      - entity: sensor.battmind_powerwall_action
                        yaxis_id: state
                        type: area
                        name: '@@force_discharge@@'
                        unit: ''
                        color: '#ff9800'
                        opacity: 0.22
                        stroke_width: 0
                        curve: stepline
                        data_generator: |
                          const prices = hass.states['sensor.energi_data_service']?.attributes || {};
                          const sell = hass.states['sensor.energi_data_service_salg']?.attributes || {};
                          const rows = [...(prices.raw_today || []), ...(prices.forecast || []), ...(prices.tomorrow_valid ? prices.raw_tomorrow || [] : []), ...(sell.raw_today || []), ...(sell.forecast || []), ...(sell.tomorrow_valid ? sell.raw_tomorrow || [] : [])];
                          const hours = new Set((entity.attributes.force_discharge_timestamps || []).map(ts => {
                            const d = new Date(ts); d.setMinutes(0, 0, 0); return d.getTime();
                          }));
                          const times = [...new Set(rows.map(row => new Date(row.hour).getTime()).filter(Number.isFinite))].sort((a, b) => a - b);
                          return times.map(time => {
                            const hour = new Date(time); hour.setMinutes(0, 0, 0);
                            return [time, hours.has(hour.getTime()) ? 1 : 0];
                          });
                        show:
                          in_brush: false
                          legend_value: false
            grid_options:
              columns: full
              rows: auto
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.stromligning_current_price_vat
                    state: unavailable
                card:
                  type: horizontal-stack
                  cards:
                    - type: markdown
                      content: '# Strømligning @@is_down@@ <font color=red>!!!</font>'
                    - show_name: true
                      show_icon: true
                      type: button
                      entity: sensor.stromligning_current_price_vat
                      tap_action:
                        action: call-service
                        service: homeassistant.reload_config_entry
                        target:
                          entity_id: sensor.stromligning_current_price_vat
                      hold_action:
                        action: none
                      icon: mdi:reload
