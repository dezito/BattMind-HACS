              | @@rule@@ | kWh | kr/kWh | @@estimated@@ |
              |:---|---:|---:|---:|
              {% for r in charging -%}
              | {{ r.emoji }} {{ r.name }} | {{ r.charged }} | {{ n(r.charge_unit) }} | {{ n(r.estimated) }} |
              {% endfor %}

              **@@rules_discharging@@**

              | @@rule@@ | kWh | @@savings@@ kr |
              |:---|---:|---:|
              {% for r in discharging -%}
              | {{ r.emoji }} {{ r.name }} | {{ r.discharged }} | {{ n(r.savings) }} |
              {% endfor %}
