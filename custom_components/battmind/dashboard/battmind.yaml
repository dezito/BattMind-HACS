views:
  - type: sections
    path: overview
    sections:
      - type: grid
        cards:
          - type: custom:apexcharts-card
            graph_span: '@@forecast_span@@'
            experimental:
              brush: true
              hidden_by_default: true
            brush:
              selection_span: '@@forecast_span@@'
            header:
              show: true
              title: '@@soc_chart_title@@'
              show_states: false
            span:
              start: hour
            yaxis:
              - id: soc
                decimals: 1
                min: 0
                max: 100
              - id: state
                opposite: true
                min: 0
                max: 1
                show: false
            apex_config:
              tooltip:
                shared: true
                intersect: false
                fixed:
                  enabled: true
                  position: topLeft
                x:
                  show: true
                  format: ddd dd/MM HH:mm
                enabledOnSeries:
                  - 0
              stroke:
                curve: smooth
              dataLabels:
                enabled: false
            all_series_config:
              group_by:
                duration: 15min
                func: avg
                fill: last
            series:
              - entity: sensor.battmind_powerwall_action
                type: area
                name: '@@battery_forecast@@'
                yaxis_id: soc
                color: blue
                data_generator: >
                  const flow = entity.attributes.battery_level_flow || [];

                  return flow.map(p => [new Date(p.hour).setMinutes(59, 59, 59),
                  p.battery_level]);
                stroke_width: 2
                float_precision: 0
                show:
                  in_brush: true
                  legend_value: false
                  in_header: true
              - entity: sensor.battmind_powerwall_action
                name: '@@charge@@'
                type: area
                yaxis_id: state
                color: green
                opacity: 0.5
                data_generator: |
                  const flow = entity.attributes.battery_level_flow || [];
                  if (!flow.length) return [];

                  const chargeList = entity.attributes.charge_timestamps || [];
                  const chargeHours = new Set(
                    chargeList.map(ts => {
                      const d = new Date(ts);
                      d.setMinutes(0, 0, 0);
                      return d.getTime();
                    })
                  );

                  const first = new Date(flow[0].hour);
                  first.setMinutes(0, 0, 0);
                  const last = new Date(flow[flow.length - 1].hour);
                  last.setMinutes(0, 0, 0);
                  const startMs = first.getTime();
                  const endMs   = last.getTime() + 60 * 60 * 1000;

                  const step = 5 * 60 * 1000;
                  const points = [];

                  for (let t = startMs; t <= endMs; t += step) {
                    const d = new Date(t);
                    const h = new Date(d);
                    h.setMinutes(0, 0, 0);
                    const hMs = h.getTime();

                    const val = chargeHours.has(hMs) ? 1 : 0;
                    points.push([d, val]);
                  }

                  return points;
                stroke_width: 0
                float_precision: 0
                show:
                  in_brush: true
                  legend_value: false
              - entity: sensor.battmind_powerwall_action
                name: '@@force_discharge@@'
                type: area
                yaxis_id: state
                color: orange
                opacity: 0.33
                data_generator: >
                  const flow = entity.attributes.battery_level_flow || [];

                  if (!flow.length) return [];


                  // Sæt med timestart (ms) for hver state-type

                  const forceDischargeList =
                  entity.attributes.force_discharge_timestamps || [];


                  const forceDischargeHours = new Set(
                    forceDischargeList.map(ts => {
                      const d = new Date(ts);
                      d.setMinutes(0, 0, 0);
                      return d.getTime();
                    })
                  );


                  // 5-min grid fra første -> sidste time

                  const first = new Date(flow[0].hour);

                  first.setMinutes(0, 0, 0);

                  const last = new Date(flow[flow.length - 1].hour);

                  last.setMinutes(0, 0, 0);

                  const startMs = first.getTime();

                  const endMs   = last.getTime() + 60 * 60 * 1000; // +1 time


                  const step = 5 * 60 * 1000;

                  const points = [];


                  for (let t = startMs; t <= endMs; t += step) {
                    const d = new Date(t);
                    const h = new Date(d);
                    h.setMinutes(0, 0, 0);
                    const hMs = h.getTime();

                    // Charge vinder over discharge
                    let val = 0;
                    if (forceDischargeHours.has(hMs)) {
                      val = 1;
                    }
                    points.push([d, val]);
                  }


                  return points;
                stroke_width: 0
                float_precision: 0
                show:
                  hidden_by_default: false
                  in_brush: true
                  legend_value: false
              - entity: sensor.battmind_powerwall_action
                name: '@@discharge@@'
                type: area
                yaxis_id: state
                color: yellow
                opacity: 0.33
                data_generator: >
                  const flow = entity.attributes.battery_level_flow || [];

                  if (!flow.length) return [];


                  // Sæt med timestart (ms) for hver state-type

                  const dischargeList = entity.attributes.discharge_timestamps
                  || [];

                  const chargeList    = entity.attributes.charge_timestamps ||
                  [];


                  const dischargeHours = new Set(
                    dischargeList.map(ts => {
                      const d = new Date(ts);
                      d.setMinutes(0, 0, 0);
                      return d.getTime();
                    })
                  );

                  const chargeHours = new Set(
                    chargeList.map(ts => {
                      const d = new Date(ts);
                      d.setMinutes(0, 0, 0);
                      return d.getTime();
                    })
                  );


                  // 5-min grid fra første -> sidste time

                  const first = new Date(flow[0].hour);

                  first.setMinutes(0, 0, 0);

                  const last = new Date(flow[flow.length - 1].hour);

                  last.setMinutes(0, 0, 0);

                  const startMs = first.getTime();

                  const endMs   = last.getTime() + 60 * 60 * 1000; // +1 time


                  const step = 5 * 60 * 1000;

                  const points = [];


                  for (let t = startMs; t <= endMs; t += step) {
                    const d = new Date(t);
                    const h = new Date(d);
                    h.setMinutes(0, 0, 0);
                    const hMs = h.getTime();

                    // Charge vinder over discharge
                    let val = 0;
                    if (!chargeHours.has(hMs) && dischargeHours.has(hMs)) {
                      val = 1;
                    }
                    points.push([d, val]);
                  }


                  return points;
                stroke_width: 0
                float_precision: 0
                show:
                  hidden_by_default: true
                  in_brush: true
                  legend_value: false
              - entity: sensor.battmind_powerwall_action
                name: '@@solar_only@@'
                type: area
                yaxis_id: state
                color: red
                opacity: 0.25
                data_generator: >
                  const flow = entity.attributes.battery_level_flow || [];

                  if (!flow.length) return [];


                  const force_solar_only_chargingList =
                  entity.attributes.force_solar_only_charging_timestamps || [];

                  const force_solar_only_chargingHours = new Set(
                    force_solar_only_chargingList.map(ts => {
                      const d = new Date(ts);
                      d.setMinutes(0, 0, 0);
                      return d.getTime();
                    })
                  );


                  const first = new Date(flow[0].hour);

                  first.setMinutes(0, 0, 0);

                  const last = new Date(flow[flow.length - 1].hour);

                  last.setMinutes(0, 0, 0);

                  const startMs = first.getTime();

                  const endMs   = last.getTime() + 60 * 60 * 1000;


                  const step = 5 * 60 * 1000;

                  const points = [];


                  for (let t = startMs; t <= endMs; t += step) {
                    const d = new Date(t);
                    const h = new Date(d);
                    h.setMinutes(0, 0, 0);
                    const hMs = h.getTime();

                    const val = force_solar_only_chargingHours.has(hMs) ? 1 : 0;
                    points.push([d, val]);
                  }


                  return points;
                stroke_width: 0
                float_precision: 0
                show:
                  hidden_by_default: false
                  in_brush: true
                  legend_value: false
            grid_options:
              columns: 60
              rows: auto
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.energi_data_service
                    state: unavailable
                card:
                  type: horizontal-stack
                  cards:
                    - type: markdown
                      content: '# Energi Data Service @@is_down@@ <font color=red>!!!</font>'
                    - show_name: true
                      show_icon: true
                      type: button
                      entity: sensor.energi_data_service
                      tap_action:
                        action: call-service
                        service: homeassistant.reload_config_entry
                        target:
                          entity_id: sensor.energi_data_service
                      hold_action:
                        action: none
                      icon: mdi:reload
                      name: '@@restart@@ Energi Data Service'
                      show_state: true
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.energi_data_service
                    state_not: unavailable
                card:
                  type: custom:config-template-card
                  variables:
                    today_prices: >
                      states['sensor.energi_data_service'].attributes.today ||
                      []
                    tomorrow_prices: >
                      states['sensor.energi_data_service'].attributes.tomorrow
                      || []
                    forecast_prices: >
                      if
                      (states['sensor.energi_data_service'].attributes.forecast)
                      {
                        states['sensor.energi_data_service'].attributes.forecast.map(item =>
                        item.price)
                      } else { []}
                    total_hours: >
                      const allPrices = [...vars.today_prices,
                      ...vars.tomorrow_prices, ...vars.forecast_prices];
                      allPrices.length
                    lowest_price: >
                      let min = 999; const allPrices = [...vars.today_prices,
                      ...vars.tomorrow_prices, ...vars.forecast_prices];
                      allPrices.forEach(price => {
                        if (price < min) min = price;
                      }); min * 1.05
                    highest_price: >
                      let max = -999; const allPrices = [...vars.today_prices,
                      ...vars.tomorrow_prices, ...vars.forecast_prices];
                      allPrices.forEach(price => {
                        if (price > max) max = price;
                      }); max * 0.95
                    mean_price: >
                      let sum = 0.0; const allPrices = [...vars.today_prices,
                      ...vars.tomorrow_prices, ...vars.forecast_prices];
                      allPrices.forEach(price => {
                        sum += price;
                      }); const mean = sum / vars.total_hours; mean
                    step_under_mean: |
                      (vars.mean_price - vars.lowest_price) / 5
                    step_over_mean: |
                      (vars.highest_price - vars.mean_price) / 5
                    price1: vars.lowest_price
                    price2: vars.mean_price - vars.step_under_mean * 4
                    price3: vars.mean_price - vars.step_under_mean * 3
                    price4: vars.mean_price - vars.step_under_mean * 2
                    price5: vars.mean_price - vars.step_under_mean * 1
                    price6: vars.mean_price
                    price7: vars.mean_price + vars.step_over_mean * 1
                    price8: vars.mean_price + vars.step_over_mean * 2
                    price9: vars.mean_price + vars.step_over_mean * 3
                    price10: vars.mean_price + vars.step_over_mean * 4
                    price11: vars.highest_price
                    total_span: 24 * 7 - 1
                  entities: []
                  card:
                    type: custom:apexcharts-card
                    apex_config:
                      chart:
                        height: 300px
                      xaxis:
                        tooltip:
                          enabled: false
                      tooltip:
                        shared: true
                        intersect: false
                        fixed:
                          enabled: true
                          position: topLeft
                        x:
                          show: true
                        enabledOnSeries:
                          - 0
                          - 1
                          - 2
                      stroke:
                        curve: straight
                      markers:
                        size: 0
                    all_series_config:
                      unit: kWh
                      extend_to: false
                      fill_raw: zero
                      show:
                        legend_value: false
                        offset_in_name: false
                    experimental:
                      color_threshold: true
                      brush: true
                    brush:
                      selection_span: ${total_span + "h"}
                    header:
                      title: >-
                        ${"@@price_chart_title@@ 🔵" +
                        vars.lowest_price.toFixed(2) + " 🟢" +
                        vars.mean_price.toFixed(2) + " 🟣" +
                        vars.highest_price.toFixed(2)}
                      show: true
                      standard_format: false
                      show_states: false
                      colorize_states: true
                    now:
                      show: true
                      label: '@@now@@'
                    graph_span: ${total_span +"h"}
                    span:
                      start: day
                    yaxis:
                      - id: price
                      - id: solar
                        opposite: true
                        decimals: 1
                        max: ~6.0
                        min: 0
                    show:
                      loading: true
                      last_updated: true
                    series:
                      - entity: sensor.energi_data_service
                        yaxis_id: price
                        type: column
                        name: '@@incl_taxes@@'
                        unit: kr.
                        color: green
                        data_generator: |
                          var data = []
                          if (entity.attributes.raw_today) {
                            var raw_today = entity.attributes.raw_today.map((start, index) => {
                              return [new Date(start["hour"]), entity.attributes.raw_today[index]["price"]];
                            });
                            data = data.concat(raw_today);
                          }
                          if (entity.attributes.forecast) {
                            var forecast = entity.attributes.forecast.map((start, index) => {
                              return [new Date(start["hour"]), entity.attributes.forecast[index]["price"]];
                            });
                            data = data.concat(forecast);
                          }
                          if (entity.attributes.tomorrow_valid) {
                            var tomorrow = entity.attributes.raw_tomorrow.map((start, index) => {
                              return [new Date(start["hour"]), entity.attributes.raw_tomorrow[index]["price"]];
                            });
                            data = data.concat(tomorrow);
                          }
                          //console.log('energi_data_service ', data);
                          return data;
                        float_precision: 2
                        group_by:
                          func: avg
                          duration: 15min
                        color_threshold:
                          - value: ${vars.price1}
                            color: '#0064FF'
                          - value: ${vars.price2}
                            color: '#0096FF'
                          - value: ${vars.price3}
                            color: '#00B496'
                          - value: ${vars.price4}
                            color: '#00FA50'
                          - value: ${vars.price5}
                            color: '#00FF32'
                          - value: ${vars.price6}
                            color: '#00FF00'
                          - value: ${vars.price7}
                            color: '#FFFF00'
                          - value: ${vars.price8}
                            color: '#FFA500'
                          - value: ${vars.price9}
                            color: '#FF5000'
                          - value: ${vars.price10}
                            color: '#C81919'
                          - value: ${vars.price11}
                            color: '#C800C8'
                        opacity: 0.75
                        show:
                          in_brush: true
                      - entity: sensor.energi_data_service_salg
                        yaxis_id: price
                        type: area
                        name: '@@sell_price@@'
                        unit: kr.
                        color: white
                        stroke_width: 0
                        data_generator: |
                          var data = []
                          if (entity.attributes.raw_today) {
                            var raw_today = entity.attributes.raw_today.map((start, index) => {
                              return [new Date(start["hour"]), entity.attributes.raw_today[index]["price"]];
                            });
                            data = data.concat(raw_today);
                          }
                          if (entity.attributes.forecast) {
                            var forecast = entity.attributes.forecast.map((start, index) => {
                              return [new Date(start["hour"]), entity.attributes.forecast[index]["price"]];
                            });
                            data = data.concat(forecast);
                          }
                          if (entity.attributes.tomorrow_valid) {
                            var tomorrow = entity.attributes.raw_tomorrow.map((start, index) => {
                              return [new Date(start["hour"]), entity.attributes.raw_tomorrow[index]["price"]];
                            });
                            data = data.concat(tomorrow);
                          }
                          //console.log('energi_data_service ', data);
                          return data;
                        float_precision: 2
                        group_by:
                          func: avg
                          duration: 15min
                        opacity: 0.75
                        show:
                          in_brush: true
                      - entity: sensor.solcast_pv_forecast_forecast_today
                        yaxis_id: solar
                        type: area
                        name: '@@solar_forecast@@'
                        data_generator: >
                          const toUTC00 = (d) => {
                            const x = new Date(d);
                            return new Date(Date.UTC(
                              x.getUTCFullYear(), x.getUTCMonth(), x.getUTCDate(), x.getUTCHours(), 0, 0, 0
                            ));
                          };

                          const map = new Map(); const eds =
                          hass.states['sensor.energi_data_service']?.attributes
                          || {}; const pushZero = (rows) => {
                            (rows || []).forEach(r => {
                              const key = toUTC00(r.hour).getTime();
                              if (!map.has(key)) map.set(key, 0);
                            });
                          };

                          pushZero(eds.raw_today); pushZero(eds.forecast);

                          if (eds.tomorrow_valid) pushZero(eds.raw_tomorrow);

                          const overlay = (series) => {
                            (series || []).forEach(row => {
                              const key = toUTC00(row.period_start).getTime();
                              map.set(key, row.pv_estimate);
                            });
                          };


                          overlay(entity.attributes.detailedHourly || []);
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_tomorrow']?.attributes?.detailedHourly
                          || []);
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_3']?.attributes?.detailedHourly
                          || []);
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_4']?.attributes?.detailedHourly
                          || []);
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_5']?.attributes?.detailedHourly
                          || []);
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_6']?.attributes?.detailedHourly
                          || []);
                          overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_7']?.attributes?.detailedHourly
                          || []);

                          const out = Array.from(map.entries())
                            .sort((a,b) => a[0] - b[0])
                            .map(([k,v]) => [new Date(Number(k)), v]);

                          //console.log('solcast ', out);

                          return out;
                        color: orange
                        stroke_width: 0
                        opacity: 0.5
                        group_by:
                          func: avg
                          duration: 15min
                        show:
                          in_brush: true
                      - entity: sensor.energi_data_service
                        yaxis_id: price
                        type: area
                        name: '@@forecast@@'
                        unit: ''
                        stroke_width: 0
                        opacity: 0.25
                        color: purple
                        data_generator: |
                          try {
                            var eds = (entity && entity.attributes) ? entity.attributes : {};
                            //if (eds.tomorrow_valid) return [];

                            // Start: første forecast-hour (mest korrekt)
                            var start = null;
                            if (eds.forecast && eds.forecast.length && eds.forecast[0] && eds.forecast[0].hour) {
                              start = new Date(eds.forecast[0].hour).getTime();
                            }
                            
                            // Fallback: i morgen 00:00 lokal tid
                            if (!start || isNaN(start)) {
                              var now = new Date();
                              start = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0).getTime();
                            }
                            
                            
                            // Brug de samme rækker som du alligevel plotter
                            var rows = [];
                            if (eds.raw_today) rows = rows.concat(eds.raw_today);
                            if (eds.forecast) rows = rows.concat(eds.forecast);
                            if (eds.raw_tomorrow) rows = rows.concat(eds.raw_tomorrow);

                            // Max pris til at fylde "hele højden"
                            var maxP = 0;
                            for (var i = 0; i < rows.length; i++) {
                              var p = Number(rows[i] && rows[i].price);
                              if (!isNaN(p) && p > maxP) maxP = p;
                            }
                            if (maxP <= 0) maxP = 10;

                            // Unikke tider sorteret
                            var map = {};
                            for (var j = 0; j < rows.length; j++) {
                              var h = rows[j] && rows[j].hour;
                              if (!h) continue;
                              var t = new Date(h).getTime();
                              if (isNaN(t)) continue;
                              map[t] = 1;
                            }
                            var times = Object.keys(map).map(function(x){ return Number(x); }).sort(function(a,b){ return a-b; });

                            // Fail-safe: hvis vi ikke fik tider, lav 2 punkter så kortet ikke hænger
                            if (!times.length) {
                              return [
                                [new Date(start), maxP],
                                [new Date(start + 3600000), maxP]
                              ];
                            }

                            // 0 før start, max efter start => udfylder resten
                            var out = [];
                            for (var k = 0; k < times.length; k++) {
                              var tt = times[k];
                              out.push([new Date(tt), (tt >= start) ? maxP : 0]);
                            }
                            return out;

                          } catch (e) {
                            console.log("forecast_zone error", e);
                            return [];
                          }
                        group_by:
                          func: avg
                          duration: 15min
                        show:
                          in_brush: false
                          legend_value: false
            grid_options:
              columns: full
              rows: auto
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.stromligning_current_price_vat
                    state: unavailable
                card:
                  type: horizontal-stack
                  cards:
                    - type: markdown
                      content: '# Strømligning @@is_down@@ <font color=red>!!!</font>'
                    - show_name: true
                      show_icon: true
                      type: button
                      entity: sensor.stromligning_current_price_vat
                      tap_action:
                        action: call-service
                        service: homeassistant.reload_config_entry
                        target:
                          entity_id: sensor.stromligning_current_price_vat
                      hold_action:
                        action: none
                      icon: mdi:reload
                      name: '@@restart@@ Strømligning'
                      show_state: true
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.stromligning_current_price_vat
                    state_not: unavailable
                card:
                  type: custom:config-template-card
                  variables:
                    today_prices: |
                      states['sensor.stromligning_current_price_vat']
                        ?.attributes?.prices || []
                    tomorrow_prices: |
                      (() => {
                        const entity =
                          states['binary_sensor.stromligning_tomorrow_available_vat'];

                        return entity?.attributes?.prices || [];
                      })()
                    forecast_prices: |
                      states['sensor.stromligning_forecasts_vat']
                        ?.attributes?.prices || []
                    all_prices: |
                      (() => {
                        const today =
                          states['sensor.stromligning_current_price_vat']
                            ?.attributes?.prices || [];

                        const tomorrowEntity =
                          states['binary_sensor.stromligning_tomorrow_available_vat'];

                        const tomorrow =
                          tomorrowEntity?.attributes?.prices || [];

                        const tomorrowIsForecast =
                          tomorrowEntity?.attributes?.forecast_data === true;

                        const officialTomorrow =
                          tomorrowIsForecast ? [] : tomorrow;

                        const official = [
                          ...today,
                          ...officialTomorrow
                        ];

                        let officialEnd = 0;

                        official.forEach(p => {
                          const end = new Date(p.end).getTime();

                          if (!isNaN(end) && end > officialEnd)
                            officialEnd = end;
                        });

                        const forecast =
                          states['sensor.stromligning_forecasts_vat']
                            ?.attributes?.prices || [];

                        const prices = [
                          ...today,
                          ...tomorrow
                        ]
                          .map(p => Number(p.price))
                          .filter(Number.isFinite);

                        let forecastEnd = 0;

                        tomorrow.forEach(p => {
                          const end = new Date(p.end).getTime();

                          if (!isNaN(end) && end > forecastEnd)
                            forecastEnd = end;
                        });

                        const existingEnd =
                          Math.max(officialEnd, forecastEnd);

                        forecast.forEach(p => {
                          const start = new Date(p.start).getTime();
                          const price = Number(p.price);

                          if (
                            start >= existingEnd &&
                            Number.isFinite(price)
                          ) {
                            prices.push(price);
                          }
                        });

                        return prices;
                      })()
                    total_hours: |
                      vars.all_prices.length
                    lowest_price: |
                      (() => {
                        if (!vars.all_prices.length)
                          return 0;

                        return Math.min(...vars.all_prices) * 1.05;
                      })()
                    highest_price: |
                      (() => {
                        if (!vars.all_prices.length)
                          return 0;

                        return Math.max(...vars.all_prices) * 0.95;
                      })()
                    mean_price: |
                      (() => {
                        if (!vars.all_prices.length)
                          return 0;

                        return vars.all_prices.reduce(
                          (sum, price) => sum + price,
                          0
                        ) / vars.all_prices.length;
                      })()
                    step_under_mean: |
                      (vars.mean_price - vars.lowest_price) / 5
                    step_over_mean: |
                      (vars.highest_price - vars.mean_price) / 5
                    price1: vars.lowest_price
                    price2: vars.mean_price - vars.step_under_mean * 4
                    price3: vars.mean_price - vars.step_under_mean * 3
                    price4: vars.mean_price - vars.step_under_mean * 2
                    price5: vars.mean_price - vars.step_under_mean
                    price6: vars.mean_price
                    price7: vars.mean_price + vars.step_over_mean
                    price8: vars.mean_price + vars.step_over_mean * 2
                    price9: vars.mean_price + vars.step_over_mean * 3
                    price10: vars.mean_price + vars.step_over_mean * 4
