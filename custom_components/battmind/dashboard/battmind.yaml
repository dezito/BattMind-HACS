              {% macro n(v, d=2) %}{{ v | round(d) if v is number else '–' }}{% endmacro %}
              {% set rules = states.sensor.battmind_analysis.attributes.rules or [] %}
              {% set charging = rules | selectattr('charged', 'gt', 0) | list %}
              {% set discharging = rules | selectattr('discharged', 'gt', 0) | list %}
              {% if rules -%}
              **@@rules_charging@@**

              | @@rule@@ | kWh | @@valuta_kwh@@ | @@estimated@@ |
              |:---|---:|---:|---:|
              {% for r in charging -%}
              | {{ r.emoji }} {{ r.name }} | {{ r.charged }} | {{ n(r.charge_unit) }} | {{ n(r.estimated) }} |
              {% endfor %}

              **@@rules_discharging@@**

              | @@rule@@ | kWh | @@savings@@ @@valuta@@ |
              |:---|---:|---:|
              {% for r in discharging -%}
              | {{ r.emoji }} {{ r.name }} | {{ r.discharged }} | {{ n(r.savings) }} |
              {% endfor %}
              {%- else -%}
              <ha-alert alert-type="info">@@no_data@@</ha-alert>
              {%- endif %}
            grid_options:
              columns: full
      # cycles, wear and the savings per month
      - type: grid
