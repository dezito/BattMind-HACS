              columns: full
          - type: markdown
            visibility:
              - condition: state
                entity: switch.battmind_enhance_battery_efficiency
                state: 'off'
            content: '<ha-alert alert-type="warning">@@efficiency_curve_off@@</ha-alert>'
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            header:
              show: true
              title: '@@efficiency_curve_title@@'
              show_states: false
            graph_span: 24h
            span:
              end: minute
            now:
              show: false
            yaxis:
              - min: 0
                max: 100
                decimals: 0
            all_series_config:
              type: line
              curve: straight
              unit: ' %'
              float_precision: 1
              stroke_width: 3
              show:
                legend_value: false
                in_header: false
            apex_config:
              chart:
                height: 240px
