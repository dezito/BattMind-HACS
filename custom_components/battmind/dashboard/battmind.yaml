                    series:
                      - entity: sensor.stromligning_current_price_vat
                        yaxis_id: price
                        type: column
                        name: '@@incl_taxes@@'
                        unit: kr.
                        color: green
                        data_generator: |
                          const data = [];

                          // ------------------------------------------
                          // I DAG
                          // ------------------------------------------

                          const today =
                            hass.states[
                              'sensor.stromligning_current_price_vat'
                            ]?.attributes?.prices || [];

                          today.forEach(p => {
                            const price = Number(p.price);

                            if (Number.isFinite(price)) {
                              data.push([
                                new Date(p.start),
                                price
                              ]);
                            }
                          });


                          // ------------------------------------------
                          // I MORGEN
                          // ------------------------------------------

                          const tomorrowEntity =
                            hass.states[
                              'binary_sensor.stromligning_tomorrow_available_vat'
                            ];

                          const tomorrowPrices =
                            tomorrowEntity?.attributes?.prices || [];

                          const tomorrowIsForecast =
                            tomorrowEntity?.attributes?.forecast_data === true;

                          const officialTomorrow =
                            tomorrowIsForecast
                              ? []
                              : tomorrowPrices;

                          officialTomorrow.forEach(p => {
                            const price = Number(p.price);

                            if (Number.isFinite(price)) {
                              data.push([
                                new Date(p.start),
                                price
                              ]);
                            }
                          });


                          // ------------------------------------------
                          // SIDSTE OFFICIELLE PRIS
                          // ------------------------------------------

                          let officialEnd = 0;

                          [...today, ...officialTomorrow].forEach(p => {
                            const end = new Date(p.end).getTime();

                            if (
                              !isNaN(end) &&
                              end > officialEnd
                            ) {
                              officialEnd = end;
                            }
                          });


                          // ------------------------------------------
                          // FORECAST FOR I MORGEN
                          // ------------------------------------------

                          if (tomorrowIsForecast) {
                            tomorrowPrices.forEach(p => {
                              const price = Number(p.price);

                              if (Number.isFinite(price)) {
                                data.push([
                                  new Date(p.start),
                                  price
                                ]);
                              }
                            });
                          }


                          // ------------------------------------------
                          // SIDSTE TOMORROW-TIDSPUNKT
                          // ------------------------------------------

                          let tomorrowEnd = officialEnd;

                          tomorrowPrices.forEach(p => {
                            const end = new Date(p.end).getTime();

                            if (
                              !isNaN(end) &&
                              end > tomorrowEnd
                            ) {
                              tomorrowEnd = end;
                            }
                          });


                          // ------------------------------------------
                          // FORECAST
                          // ------------------------------------------

                          const forecast =
                            hass.states[
                              'sensor.stromligning_forecasts_vat'
                            ]?.attributes?.prices || [];

                          forecast.forEach(p => {
                            const start =
                              new Date(p.start).getTime();

                            const price =
                              Number(p.price);

                            if (
                              start >= tomorrowEnd &&
                              Number.isFinite(price)
                            ) {
                              data.push([
                                new Date(p.start),
                                price
                              ]);
                            }
                          });


                          return data.sort(
                            (a, b) => a[0] - b[0]
                          );
                        float_precision: 2
                        group_by:
                          func: avg
                          duration: 15min
                        color_threshold:
                          - value: ${vars.price1}
                            color: '#0064FF'
                          - value: ${vars.price2}
                            color: '#0096FF'
                          - value: ${vars.price3}
                            color: '#00B496'
                          - value: ${vars.price4}
                            color: '#00FA50'
                          - value: ${vars.price5}
                            color: '#00FF32'
                          - value: ${vars.price6}
                            color: '#00FF00'
                          - value: ${vars.price7}
                            color: '#FFFF00'
                          - value: ${vars.price8}
                            color: '#FFA500'
                          - value: ${vars.price9}
                            color: '#FF5000'
                          - value: ${vars.price10}
                            color: '#C81919'
                          - value: ${vars.price11}
                            color: '#C800C8'
                        opacity: 0.75
                        show:
                          in_brush: true
                      - entity: sensor.stromligning_15min_spotprice_ex_vat
                        yaxis_id: price
                        type: area
                        name: '@@sell_price@@'
                        unit: kr.
                        color: white
                        stroke_width: 0
                        data_generator: |
                          const data = [];

                          const sellFee = 0.025;

                          const nettariff = Number(
                            hass.states[
                              'sensor.stromligning_nettariff_vat'
                            ]?.state
                          ) || 0;

                          const systemtariff = Number(
                            hass.states[
                              'sensor.stromligning_systemtariff_vat'
                            ]?.state
                          ) || 0;

                          const sellCosts =
                            nettariff +
                            systemtariff +
                            sellFee;


                          // ------------------------------------------
                          // I DAG
                          // ------------------------------------------

                          const today =
                            hass.states[
                              'sensor.stromligning_15min_spotprice_ex_vat'
                            ]?.attributes?.prices || [];

                          today.forEach(p => {
                            const spotprice = Number(p.price);

                            if (Number.isFinite(spotprice)) {
                              data.push([
                                new Date(p.start),
                                spotprice - sellCosts
                              ]);
                            }
                          });


                          // ------------------------------------------
                          // I MORGEN
                          // ------------------------------------------

                          const tomorrowEntity =
                            hass.states[
                              'binary_sensor.stromligning_15min_tomorrow_available_ex_vat'
                            ];

                          const tomorrowPrices =
                            tomorrowEntity?.attributes?.prices || [];

                          tomorrowPrices.forEach(p => {
                            const spotprice = Number(p.price);

                            if (Number.isFinite(spotprice)) {
                              data.push([
                                new Date(p.start),
                                spotprice - sellCosts
                              ]);
                            }
                          });


                          // ------------------------------------------
                          // SIDSTE PRIS FRA TOMORROW ENTITY
                          // ------------------------------------------

                          let availableEnd = 0;

                          [...today, ...tomorrowPrices].forEach(p => {
                            const end =
                              new Date(p.end).getTime();

                            if (
                              !isNaN(end) &&
                              end > availableEnd
                            ) {
                              availableEnd = end;
                            }
                          });


                          // ------------------------------------------
                          // FORECAST
                          // ------------------------------------------

                          const forecast =
                            hass.states[
                              'sensor.stromligning_15min_forecasts_ex_vat'
                            ]?.attributes?.prices || [];

                          forecast.forEach(p => {
                            const start =
                              new Date(p.start).getTime();

                            const spotprice =
                              Number(p.price);

                            if (
                              start >= availableEnd &&
                              Number.isFinite(spotprice)
                            ) {
                              data.push([
                                new Date(p.start),
                                spotprice - sellCosts
                              ]);
                            }
                          });


                          return data.sort(
                            (a, b) => a[0] - b[0]
                          );
                        float_precision: 2
                        group_by:
                          func: avg
                          duration: 15min
                        opacity: 0.75
                        show:
                          in_brush: true
                      - entity: sensor.solcast_pv_forecast_forecast_today
                        yaxis_id: solar
                        type: area
                        name: '@@solar_forecast@@'
                        data_generator: |
                          const toUTC00 = (d) => {
                            const x = new Date(d);

                            return new Date(Date.UTC(
                              x.getUTCFullYear(),
                              x.getUTCMonth(),
                              x.getUTCDate(),
                              x.getUTCHours(),
                              0,
                              0,
                              0
                            ));
                          };

                          const map = new Map();


                          // ------------------------------------------
                          // OPRET ALLE PRISTIMESTAMPS SOM 0
                          // ------------------------------------------

                          const addTimes = (rows) => {
                            (rows || []).forEach(row => {
                              if (!row.start)
                                return;

                              const key =
                                toUTC00(row.start).getTime();

                              if (!map.has(key))
                                map.set(key, 0);
                            });
                          };


                          // I dag
                          addTimes(
                            hass.states[
                              'sensor.stromligning_current_price_vat'
                            ]?.attributes?.prices || []
                          );


                          // I morgen - både forecast og officielle
                          const tomorrowEntity =
                            hass.states[
                              'binary_sensor.stromligning_tomorrow_available_vat'
                            ];

                          addTimes(
                            tomorrowEntity?.attributes?.prices || []
                          );


                          // Forecast
                          addTimes(
                            hass.states[
                              'sensor.stromligning_forecasts_vat'
                            ]?.attributes?.prices || []
                          );


                          // ------------------------------------------
                          // SOLCAST DATA
                          // ------------------------------------------

                          const overlay = (series) => {
                            (series || []).forEach(row => {
                              if (!row.period_start)
                                return;

                              const key =
                                toUTC00(
                                  row.period_start
                                ).getTime();

                              map.set(
                                key,
                                Number(row.pv_estimate) || 0
                              );
                            });
                          };


                          overlay(
                            entity.attributes?.detailedHourly || []
                          );

                          overlay(
                            hass.states[
                              'sensor.solcast_pv_forecast_forecast_tomorrow'
                            ]?.attributes?.detailedHourly || []
                          );

                          overlay(
                            hass.states[
                              'sensor.solcast_pv_forecast_forecast_day_3'
                            ]?.attributes?.detailedHourly || []
                          );

                          overlay(
                            hass.states[
                              'sensor.solcast_pv_forecast_forecast_day_4'
                            ]?.attributes?.detailedHourly || []
                          );

                          overlay(
                            hass.states[
                              'sensor.solcast_pv_forecast_forecast_day_5'
                            ]?.attributes?.detailedHourly || []
                          );

                          overlay(
                            hass.states[
                              'sensor.solcast_pv_forecast_forecast_day_6'
                            ]?.attributes?.detailedHourly || []
                          );

                          overlay(
                            hass.states[
                              'sensor.solcast_pv_forecast_forecast_day_7'
                            ]?.attributes?.detailedHourly || []
                          );


                          return Array.from(
                            map.entries()
                          )
                            .sort((a, b) => a[0] - b[0])
                            .map(([time, value]) => [
                              new Date(Number(time)),
                              value
                            ]);
                        color: orange
                        stroke_width: 0
                        opacity: 0.5
                        group_by:
                          func: avg
                          duration: 15min
                        show:
                          in_brush: true
                      - entity: sensor.stromligning_forecasts_vat
                        yaxis_id: price
                        type: area
                        name: '@@forecast@@'
                        unit: ''
                        stroke_width: 0
                        opacity: 0.25
                        color: purple
                        data_generator: |
                          try {

                            // ------------------------------------------
                            // I DAG
                            // ------------------------------------------

                            const today =
                              hass.states[
                                'sensor.stromligning_current_price_vat'
                              ]?.attributes?.prices || [];


                            // ------------------------------------------
                            // I MORGEN
                            // ------------------------------------------

                            const tomorrowEntity =
                              hass.states[
                                'binary_sensor.stromligning_tomorrow_available_vat'
                              ];

                            const tomorrowPrices =
                              tomorrowEntity?.attributes?.prices || [];

                            const tomorrowIsForecast =
                              tomorrowEntity?.attributes?.forecast_data === true;

                            const officialTomorrow =
                              tomorrowIsForecast
                                ? []
                                : tomorrowPrices;

                            const tomorrowForecast =
                              tomorrowIsForecast
                                ? tomorrowPrices
                                : [];


                            // ------------------------------------------
                            // OFFICIELLE PRISER
                            // ------------------------------------------

                            const official = [
                              ...today,
                              ...officialTomorrow
                            ];


                            // ------------------------------------------
                            // FIND STARTEN PÅ FORECAST
                            // ------------------------------------------

                            let forecastStart = 0;

                            if (tomorrowForecast.length) {
                              forecastStart =
                                Math.min(
                                  ...tomorrowForecast
                                    .map(p =>
                                      new Date(p.start).getTime()
                                    )
                                    .filter(t =>
                                      !isNaN(t)
                                    )
                                );
                            }


                            const normalForecast =
                              entity.attributes?.prices || [];


                            if (
                              !forecastStart &&
                              normalForecast.length
                            ) {
                              const times =
                                normalForecast
                                  .map(p =>
                                    new Date(p.start).getTime()
                                  )
                                  .filter(t =>
                                    !isNaN(t)
                                  );

                              if (times.length)
                                forecastStart = Math.min(...times);
                            }


                            if (!forecastStart)
                              return [];


                            // ------------------------------------------
                            // ALLE RÆKKER
                            // ------------------------------------------

                            const rows = [
                              ...official,
                              ...tomorrowForecast,
                              ...normalForecast
                            ];


                            // ------------------------------------------
                            // FIND MAX PRIS
                            // ------------------------------------------

                            let maxP = 0;

                            rows.forEach(row => {
                              const price =
                                Number(row.price);

                              if (
                                Number.isFinite(price) &&
                                price > maxP
                              ) {
                                maxP = price;
                              }
                            });


                            if (maxP <= 0)
                              maxP = 10;


                            // ------------------------------------------
                            // ALLE TIMESTAMPS
                            // ------------------------------------------

                            const times = [
                              ...new Set(
                                rows
                                  .map(row =>
                                    new Date(
                                      row.start
                                    ).getTime()
                                  )
                                  .filter(time =>
                                    !isNaN(time)
                                  )
                              )
                            ].sort(
                              (a, b) => a - b
                            );


                            if (!times.length) {
                              return [
                                [
                                  new Date(forecastStart),
                                  maxP
                                ],
                                [
                                  new Date(
                                    forecastStart +
                                    3600000
                                  ),
                                  maxP
                                ]
                              ];
                            }


                            // ------------------------------------------
                            // 0 FØR FORECAST
                            // MAX EFTER FORECAST
                            // ------------------------------------------

                            return times.map(time => [
                              new Date(time),
                              time >= forecastStart
                                ? maxP
                                : 0
                            ]);


                          } catch (e) {

                            console.log(
                              'stromligning forecast_zone error',
                              e
                            );

                            return [];
                          }
                        group_by:
                          func: avg
                          duration: 15min
                        show:
                          in_brush: false
                          legend_value: false
