          action: perform-action
          perform_action: battmind.recalc_charging_history_today
          target: {}
        label: ''
    sections:
      # economy per month (engine_analysis.py: the charging history per month)
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: '@@section_economy@@'
