                      - entity: sensor.stromligning_current_price_vat
                        yaxis_id: price
                        type: area
                        name: '@@forecast@@'
                        unit: ''
                        stroke_width: 0
                        opacity: 0.25
                        color: purple
                        data_generator: |
                          try {

                            // ------------------------------------------
                            // TODAY
                            // ------------------------------------------

                            const today =
                              hass.states[
                                'sensor.stromligning_current_price_vat'
                              ]?.attributes?.prices || [];


                            // ------------------------------------------
                            // I MORGEN
                            // ------------------------------------------

                            const tomorrowEntity =
                              hass.states[
                                'binary_sensor.stromligning_tomorrow_available_vat'
                              ];

                            const tomorrowPrices =
                              tomorrowEntity?.attributes?.prices || [];

                            const tomorrowIsForecast =
                              tomorrowEntity?.attributes?.forecast_data === true;

                            const officialTomorrow =
                              tomorrowIsForecast
                                ? []
                                : tomorrowPrices;

                            const tomorrowForecast =
                              tomorrowIsForecast
                                ? tomorrowPrices
                                : [];


                            // ------------------------------------------
                            // OFFICIELLE PRISER
                            // ------------------------------------------

                            const official = [
                              ...today,
                              ...officialTomorrow
                            ];


                            // ------------------------------------------
                            // FIND THE START OF THE FORECAST
                            // ------------------------------------------

                            let forecastStart = 0;

                            if (tomorrowForecast.length) {
                              forecastStart =
                                Math.min(
                                  ...tomorrowForecast
                                    .map(p =>
                                      new Date(p.start).getTime()
                                    )
                                    .filter(t =>
                                      !isNaN(t)
                                    )
                                );
                            }


                            const normalForecast =
                              hass.states['sensor.stromligning_forecasts_vat']?.attributes?.prices || [];


                            if (
                              !forecastStart &&
                              normalForecast.length
                            ) {
                              const times =
                                normalForecast
                                  .map(p =>
                                    new Date(p.start).getTime()
                                  )
                                  .filter(t =>
                                    !isNaN(t)
                                  );

                              if (times.length)
                                forecastStart = Math.min(...times);
                            }


                            if (!forecastStart)
                              return [];


                            // ------------------------------------------
                            // ALL ROWS
                            // ------------------------------------------

                            const rows = [
                              ...official,
                              ...tomorrowForecast,
                              ...normalForecast
                            ];


                            // ------------------------------------------
                            // FIND MAX PRIS
                            // ------------------------------------------

                            let maxP = 0;

                            rows.forEach(row => {
                              const price =
                                Number(row.price);

                              if (
                                Number.isFinite(price) &&
                                price > maxP
                              ) {
                                maxP = price;
                              }
                            });


                            if (maxP <= 0)
                              maxP = 10;


                            // ------------------------------------------
                            // ALL TIMESTAMPS
                            // ------------------------------------------

                            const times = [
                              ...new Set(
                                rows
                                  .map(row =>
                                    new Date(
                                      row.start
                                    ).getTime()
                                  )
                                  .filter(time =>
                                    !isNaN(time)
                                  )
                              )
                            ].sort(
                              (a, b) => a - b
                            );


                            if (!times.length) {
                              return [
                                [
                                  new Date(forecastStart),
                                  maxP
                                ],
                                [
                                  new Date(
                                    forecastStart +
                                    3600000
                                  ),
                                  maxP
                                ]
                              ];
                            }


                            // ------------------------------------------
                            // 0 BEFORE THE FORECAST
                            // MAX EFTER FORECAST
                            // ------------------------------------------

                            return times.map(time => [
                              new Date(time),
                              time >= forecastStart
                                ? maxP
                                : 0
                            ]);


                          } catch (e) {

                            console.log(
                              'stromligning forecast_zone error',
                              e
                            );

                            return [];
                          }
                        group_by:
                          func: avg
                          duration: 15min
