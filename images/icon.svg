<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- BattMind: et husbatteri med butler-fluesmæk, der tænker over elpriserne -->
  <defs>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Tænkeboble med prisgraf og lyn -->
  <circle cx="338" cy="236" r="11" fill="#ffffff" stroke="#1e293b" stroke-width="8"/>
  <circle cx="366" cy="200" r="17" fill="#ffffff" stroke="#1e293b" stroke-width="8"/>
  <path d="M352 120 a44 44 0 0 1 52 -62 a50 50 0 0 1 84 22 a40 40 0 0 1 -6 76 a46 46 0 0 1 -74 18 a42 42 0 0 1 -56 -54 z"
        fill="#ffffff" stroke="#1e293b" stroke-width="10" stroke-linejoin="round"/>
  <rect x="384" y="122" width="16" height="30" rx="3" fill="#22c55e"/>
  <rect x="406" y="96"  width="16" height="56" rx="3" fill="#ef4444"/>
  <rect x="428" y="132" width="16" height="20" rx="3" fill="#22c55e"/>
  <rect x="450" y="110" width="16" height="42" rx="3" fill="#f59e0b"/>
  <path d="M414 58 l-16 30 h14 l-10 26 l28 -36 h-15 l11 -20 z" fill="url(#bolt)" stroke="#1e293b" stroke-width="5" stroke-linejoin="round"/>

  <!-- Polhoved -->
  <rect x="150" y="112" width="96" height="44" rx="12" fill="#64748b" stroke="#1e293b" stroke-width="12"/>

  <!-- Batterikrop -->
  <rect x="78" y="146" width="240" height="340" rx="44" fill="url(#cell)" stroke="#1e293b" stroke-width="14"/>
  <!-- Glans -->
  <rect x="102" y="172" width="22" height="150" rx="11" fill="#ffffff" opacity="0.35"/>

  <!-- Smoking (nederste del) -->
  <path d="M85 382 H311 V442 a37 37 0 0 1 -37 37 H122 a37 37 0 0 1 -37 -37 z" fill="#1e293b"/>
  <path d="M158 382 L198 452 L238 382 z" fill="#ffffff"/>
  <!-- Fluesmæk -->
  <path d="M198 392 L160 372 Q150 392 160 412 z" fill="#dc2626" stroke="#7f1d1d" stroke-width="5" stroke-linejoin="round"/>
  <path d="M198 392 L236 372 Q246 392 236 412 z" fill="#dc2626" stroke="#7f1d1d" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="198" cy="392" r="10" fill="#b91c1c" stroke="#7f1d1d" stroke-width="5"/>
  <!-- Knapper -->
  <circle cx="198" cy="428" r="5" fill="#1e293b"/>

  <!-- Ansigt: kigger op mod tænkeboblen, ét løftet øjenbryn -->
  <circle cx="152" cy="262" r="28" fill="#ffffff" stroke="#1e293b" stroke-width="8"/>
  <circle cx="242" cy="262" r="28" fill="#ffffff" stroke="#1e293b" stroke-width="8"/>
  <circle cx="162" cy="252" r="12" fill="#1e293b"/>
  <circle cx="252" cy="252" r="12" fill="#1e293b"/>
  <circle cx="166" cy="248" r="4" fill="#ffffff"/>
  <circle cx="256" cy="248" r="4" fill="#ffffff"/>
  <path d="M128 222 Q150 212 174 220" fill="none" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
  <path d="M220 206 Q244 190 268 204" fill="none" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
  <path d="M170 322 Q200 344 232 318" fill="none" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
</svg>
